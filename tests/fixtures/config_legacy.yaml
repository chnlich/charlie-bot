# CharlieBot config in the retired flat layout, snapshotted for the legacy-key
# migration test in tests/test_config_schema.py: the loader must name every key
# here with the sectioned location it moves to. Keep the key set stable; the live
# template is configs/config.example.yaml. Per-key comments describe the retired
# keys as they were.

# --- Server ---

# Bind port.
server_port: 18498

# Web UI access token. Secret. Set this if the server is reachable beyond localhost.
charliebot_access_key: ""

# --- Paths ---

# Directories scanned for git repos.
workspace_dirs: ["~/workspace"]

# Root directory for worker worktrees.
worktree_dir: ~/worktrees

# --- Backends ---

# Reviewer backend preference: list of backend_options ids. Empty = reviewer uses the worker's backend.
model_preference: []

# Backends available for model switching.
backend_options:
  - {id: claude-opus-4.8, label: "CC · Opus 5", type: cc-claude, model: claude-opus-5, effort: xhigh}
  - {id: claude-opus-4.8-fast, label: "CC · Opus 4.8 Fast", type: cc-claude, model: claude-opus-4-8, effort: medium, fast_mode: true}
  - {id: claude-fable-5, label: "CC · Fable 5", type: cc-claude, model: claude-fable-5, effort: max}
  - {id: claude-tui, label: "Claude TUI", type: tui-cli}

# --- Backlog panel ---

# Repos shown in the backlog panel, each {label, path}.
backlog_repos: []

# --- Optional per-host settings (uncomment when used) ---
# Host addresses and credentials that ship unset.

# Slack summon entrypoint.
# Slack app bot token (xoxb-…); requires chat:write + reactions:write + history scopes.
slack_bot_token: xoxb-placeholder
# Slack app-level token (xapp-…); requires connections:write, Socket Mode only.
# slack_app_token: ""
# Slack user ids allowed to summon; empty = nobody.
# slack_allowed_user_ids: []

# Telegram notification target.
telegram_bot_token: 000:placeholder

# Other backend / notification secrets: moonshot_api_key, telegram_chat_id.
# cc-openai-compatible backends configure the upstream api_base,
# model, and api_key_env per backend_option above (no top-level fields).
# Integration keys for the skills under skills/ (the feishu_/gemini_/google_/
# google_docs_* set, linear_api_key, slack_user_token, public_base_url) stay unlisted
# here by design: CharlieBotConfig declares them so host files carrying them load
# under extra='forbid', and the consuming skill scripts read the raw yaml. Each
# skill's SKILL.md names the keys it reads.
