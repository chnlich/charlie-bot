name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'improve/')
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce contract
        run: |
          echo "$BODY" | grep -q '## Evidence' || { echo "PR body missing '## Evidence' section"; exit 1; }
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suites that parse JavaScript (sucrase) or build Tailwind resolve devDependencies from node_modules;
      # installing up front keeps the installs the suites run themselves at no-op speed.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      # One suite per tests/*.test.{js,mjs} file on disk: the glob is the single source, so a suite file that
      # lands runs here without a registration edit. The bound turns a hung runner into a step failure instead
      # of a CI hang.
      - name: Test
        run: |
          suites=$(find tests -maxdepth 1 \( -name '*.test.js' -o -name '*.test.mjs' \) | sort)
          count=$(printf '%s\n' "$suites" | grep -c .)
          echo "Running $count node suite files"
          [ "$count" -gt 0 ]
          timeout 780 node --test $suites

  # The image is pinned by name. The live host runs Ubuntu 24.04 with glibc 2.39, and a binary built against a
  # newer glibc does not start there.
  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-build

      # No tests build here. A `cargo test` in the same target directory relinks this binary with the
      # dev-dependency features unified in.
      - name: Build release server and CLI
        working-directory: rust
        run: cargo build --release --locked -p charliebot-server -p charliebot-cli

      - name: Stage binaries and checksums
        run: |
          mkdir dist
          cp rust/target/release/charliebot-server rust/target/release/charliebot dist/
          (cd dist && sha256sum charliebot charliebot-server > sha256sums.txt)

      - name: Upload server and CLI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: charliebot-server-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # The UX and performance cron directions measure a pull request's own binary in trial.sh --serve; the artifact
      # stages the same files as main's upload and is kept 3 days, one measurement round's lifetime.
      - name: Upload server and CLI binaries (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: charliebot-server-pr-${{ github.event.pull_request.head.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: error

  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The terminal tests start tmux, and the release tests' gh stub applies gh's --jq with jq.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: rust-test

      - name: Test
        working-directory: rust
        run: cargo test --locked

  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: rust-lint

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format
        working-directory: rust
        run: cargo fmt --check
