# The run, plan, trigger, input and prompt reads over every fixture kind and a missing id.
stage: session-read-api
name: session-runs
steps:
  - name: runs, manager root, starred, grouped
    method: GET
    path: /api/sessions/${sessions.atlas}/runs
    expect_status: 200
  - name: runs, manager child with child reports
    method: GET
    path: /api/sessions/${sessions.atlas_survey}/runs
    expect_status: 200
  - name: runs, worker, retried, closed
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/runs
    expect_status: 200
  - name: runs, worker, interrupted, archived
    method: GET
    path: /api/sessions/${sessions.atlas_probe}/runs
    expect_status: 200
  - name: runs, worker, queued run stopped
    method: GET
    path: /api/sessions/${sessions.atlas_scout}/runs
    expect_status: 200
  - name: runs, archived root, starred
    method: GET
    path: /api/sessions/${sessions.beacon}/runs
    expect_status: 200
  - name: runs, archived child
    method: GET
    path: /api/sessions/${sessions.beacon_draft}/runs
    expect_status: 200
  - name: runs, retired backend, pending input, unread
    method: GET
    path: /api/sessions/${sessions.cobalt}/runs
    expect_status: 200
  - name: runs, chat-thread session
    method: GET
    path: /api/sessions/${sessions.delta}/runs
    expect_status: 200
  - name: runs, recycled history, restored
    method: GET
    path: /api/sessions/${sessions.ember}/runs
    expect_status: 200
  - name: runs, plans and triggers, unread
    method: GET
    path: /api/sessions/${sessions.fable}/runs
    expect_status: 200
  - name: runs, fork of atlas
    method: GET
    path: /api/sessions/${sessions.garnet}/runs
    expect_status: 200
  - name: runs, missing id
    method: GET
    path: /api/sessions/${missing_session}/runs
    expect_status: 404
  - name: runs, newest first, manager root
    method: GET
    path: /api/sessions/${sessions.atlas}/runs
    query: {order: "desc"}
    expect_status: 200
  - name: runs, first page of one, manager root
    method: GET
    path: /api/sessions/${sessions.atlas}/runs
    query: {limit: 1}
    capture: {cursor: next_cursor}
    expect_status: 200
  - name: runs, second page of one, manager root
    method: GET
    path: /api/sessions/${sessions.atlas}/runs
    query: {limit: 1, cursor: "${capture.cursor}"}
    expect_status: 200
  - name: runs, limit above the cap
    method: GET
    path: /api/sessions/${sessions.atlas}/runs
    query: {limit: 501}
    expect_status: 422
    compare: status_and_shape
  - name: run context, manager turn
    method: GET
    path: /api/sessions/${runs.atlas_t1.session}/runs/${runs.atlas_t1.run}/context
    expect_status: 200
  - name: run context, failed manager turn
    method: GET
    path: /api/sessions/${runs.atlas_t3.session}/runs/${runs.atlas_t3.run}/context
    expect_status: 200
  - name: run context, failed work run
    method: GET
    path: /api/sessions/${runs.notes_r1.session}/runs/${runs.notes_r1.run}/context
    expect_status: 200
  - name: run context, successful work run
    method: GET
    path: /api/sessions/${runs.notes_r2.session}/runs/${runs.notes_r2.run}/context
    expect_status: 200
  - name: run context, interrupted work run
    method: GET
    path: /api/sessions/${runs.probe_r1.session}/runs/${runs.probe_r1.run}/context
    expect_status: 200
  - name: run context, stopped queued run
    method: GET
    path: /api/sessions/${runs.scout_r1.session}/runs/${runs.scout_r1.run}/context
    expect_status: 200
  - name: run context, a run of another session
    method: GET
    path: /api/sessions/${sessions.atlas}/runs/${runs.notes_r2.run}/context
  - name: run context, missing run
    method: GET
    path: /api/sessions/${sessions.atlas}/runs/${missing_run}/context
  - name: transcript, closed worker
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/transcript
  - name: transcript, archived worker
    method: GET
    path: /api/sessions/${sessions.atlas_probe}/transcript
  - name: transcript, stopped worker
    method: GET
    path: /api/sessions/${sessions.atlas_scout}/transcript
  - name: transcript, manager
    method: GET
    path: /api/sessions/${sessions.atlas}/transcript
  - name: transcript, missing id
    method: GET
    path: /api/sessions/${missing_session}/transcript
  - name: transcript, closed worker, revision capture
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/transcript
    capture: {revision: revision}
    expect_status: 200
  - name: transcript, closed worker, after the rendered rows
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/transcript
    query: {after: 3, revision: "${capture.revision}"}
    expect_status: 200
  - name: transcript, closed worker, stale revision
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/transcript
    query: {after: 3, revision: "stale"}
    expect_status: 200
  - name: transcript, negative cursor
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/transcript
    query: {after: -1}
    expect_status: 422
    compare: status_and_shape
  - name: plans, approved and closed plans
    method: GET
    path: /api/sessions/${sessions.fable}/plans
  - name: plans, no plans
    method: GET
    path: /api/sessions/${sessions.atlas}/plans
  - name: plans, missing id
    method: GET
    path: /api/sessions/${missing_session}/plans
  - name: pending triggers, pending, fired and cancelled triggers
    method: GET
    path: /api/sessions/${sessions.fable}/pending-triggers
  - name: pending triggers, no triggers
    method: GET
    path: /api/sessions/${sessions.atlas}/pending-triggers
  - name: pending triggers, missing id
    method: GET
    path: /api/sessions/${missing_session}/pending-triggers
  - name: pending task inputs, one pending input
    method: GET
    path: /api/sessions/${sessions.cobalt}/task-inputs/pending
  - name: pending task inputs, consumed and acknowledged inputs
    method: GET
    path: /api/sessions/${sessions.atlas}/task-inputs/pending
  - name: pending task inputs, consumed child reports
    method: GET
    path: /api/sessions/${sessions.atlas_survey}/task-inputs/pending
  - name: pending task inputs, worker
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/task-inputs/pending
  - name: pending task inputs, missing id
    method: GET
    path: /api/sessions/${missing_session}/task-inputs/pending
  - name: effective prompt, manager root
    method: GET
    path: /api/sessions/${sessions.atlas}/effective-prompt
  - name: effective prompt, manager child
    method: GET
    path: /api/sessions/${sessions.atlas_survey}/effective-prompt
  - name: effective prompt, worker
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/effective-prompt
  - name: effective prompt, chat-thread session
    method: GET
    path: /api/sessions/${sessions.delta}/effective-prompt
  - name: effective prompt, retired backend
    method: GET
    path: /api/sessions/${sessions.cobalt}/effective-prompt
  - name: effective prompt, missing id
    method: GET
    path: /api/sessions/${missing_session}/effective-prompt
  - name: effective prompt, work kind on a manager
    method: GET
    path: /api/sessions/${sessions.atlas}/effective-prompt
    query: {kind: "work"}
  - name: effective prompt, unknown kind
    method: GET
    path: /api/sessions/${sessions.atlas}/effective-prompt
    query: {kind: "bogus"}
    expect_status: 400
  - name: explain status, manager root
    method: GET
    path: /api/sessions/${sessions.atlas}/explain/status
  - name: explain status, missing id
    method: GET
    path: /api/sessions/${missing_session}/explain/status
  - name: explain entry, none recorded
    method: GET
    path: /api/sessions/${sessions.atlas}/explain
    query: {upto: 3}
    expect_status: 404
