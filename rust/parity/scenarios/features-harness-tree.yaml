stage: features
name: features-harness-tree
config:
  paths:
    workspace_dirs: ["${tree.root}/workspace"]
    worktree_dir: "${tree.root}/worktrees"
credentials:
  synthetic:
    fixture_home: ${tree.home}
fixture_extras: [sample_files]
steps:
  - name: read credentials through home reference
    method: GET
    path: /absolute_filepath${tree.home}/credentials.yaml
    auth: bearer
    expect_status: 200
  - name: get workspace fixture file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.sample_files.file}
    auth: bearer
    expect_status: 200
  - name: head workspace fixture file
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.sample_files.file}
    auth: bearer
    expect_status: 200
