stage: features
name: features-ext-usage-failing
# The fixture writes synthetic Claude credentials and no Codex files (see the extra's docstring). The Codex account's
# fetch runs one round gap after the read, so the read shows its pending marker.
fixture_extras: [usage_quota_accounts]
# Declaring any fake starts the CONNECT proxy, which refuses the quota hosts with 403. openai_compatible serves no
# request here: nothing in this scenario calls the openai-compatible backend.
fakes:
  openai_compatible: {}
steps:
  - kind: log_event
    name: the first account's fetch fails and logs its provider and account
    event: ext_usage_poll_error
    fields: {provider: claude, account: main}
    timeout_seconds: 60
  - kind: log_event
    name: the first round broadcasts after the failed fetch
    event: ext_usage_fetched
    timeout_seconds: 60
  - name: panel read inside the round gap, first account shows its error and the other its pending marker
    method: GET
    path: /api/ext-usage
    expect_status: 200
