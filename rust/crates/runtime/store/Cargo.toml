[package]
name = "charliebot-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
charliebot-compat.workspace = true
charliebot-core.workspace = true
lru.workspace = true
memchr.workspace = true
memmap2.workspace = true
nix.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# The test-only write-fault seam (`write_faults`). Off by default; only a dev-dependency turns it on.
write-faults = []

[dev-dependencies]
# The cross-implementation task-tree tests drive the completion owner that now writes archive facts.
charliebot-registry.workspace = true
charliebot-shell-harness.workspace = true
charliebot-tasks.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
