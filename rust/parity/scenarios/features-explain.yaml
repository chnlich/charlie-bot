# The explain routes: one divider's generation starts one agent run, a second request joins it while it is pending, and
# the reads reap a stale pending entry the way a restarted server leaves one. A malformed body answers 422 before the session
# check; a body with a wrong field type or a missing field answers the session refusal first when the session is missing.
stage: features
name: features-explain
fixture_extras: [explain_cases]
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-explain-answer}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: "Explanation: the first answer approved the plan."}]
        - gate: explain-answer
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 4, output_tokens: 4, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-explain-empty}
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 4, output_tokens: 0, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps: []
      exit_code: 3
expect_starts: 3
steps:
  - name: request an explanation of a divider with an answer
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {event_index: 3, backend: claude-sonnet}
    expect_status: 202
  - name: a second request joins the pending explanation
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {event_index: 3, backend: claude-sonnet}
    expect_status: 200
  - kind: gate
    name: release the explain agent
    open: explain-answer
  - kind: wait
    name: wait until the answered divider is ready
    timeout_seconds: 30
    until:
      file_field:
        path: sessions/${sessions.explain}/data/explain_results.json
        field: "3.state"
        equals: ready
  - name: read the answered divider's entry
    method: GET
    path: /api/sessions/${sessions.explain}/explain
    query: {upto: 3}
    expect_status: 200
  - name: read every divider's status
    method: GET
    path: /api/sessions/${sessions.explain}/explain/status
    expect_status: 200
  - name: request an explanation with an unknown backend
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {event_index: 3, backend: no-such-backend}
    expect_status: 400
  - name: request an explanation of a divider without assistant text
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {event_index: 0, backend: claude-sonnet}
    expect_status: 202
  - kind: wait
    name: wait until the divider without assistant text is an error
    timeout_seconds: 30
    until:
      file_field:
        path: sessions/${sessions.explain}/data/explain_results.json
        field: "0.state"
        equals: error
  - name: read a divider that has no entry
    method: GET
    path: /api/sessions/${sessions.explain}/explain
    query: {upto: 1}
    expect_status: 404
  - name: read an entry without the upto parameter
    method: GET
    path: /api/sessions/${sessions.explain}/explain
    expect_status: 422
    compare: status_and_shape
  - name: request an explanation for a missing session
    method: POST
    path: /api/sessions/${missing_session}/explain
    json: {event_index: 3, backend: claude-sonnet}
    expect_status: 404
  - name: malformed JSON for a missing session is refused before the session check
    method: POST
    path: /api/sessions/${missing_session}/explain
    headers: {Content-Type: application/json}
    body_file: explain-malformed.json
    expect_status: 422
    compare: status_and_shape
  - name: a wrong field type for a missing session answers the session refusal
    method: POST
    path: /api/sessions/${missing_session}/explain
    json: {event_index: "soon", backend: claude-sonnet}
    expect_status: 404
    compare: status_and_shape
  - name: a missing field for a missing session answers the session refusal
    method: POST
    path: /api/sessions/${missing_session}/explain
    json: {backend: claude-sonnet}
    expect_status: 404
    compare: status_and_shape
  - name: malformed JSON for an existing session is refused
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    headers: {Content-Type: application/json}
    body_file: explain-malformed.json
    expect_status: 422
    compare: status_and_shape
  - name: a wrong field type for an existing session is refused
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {event_index: "soon", backend: claude-sonnet}
    expect_status: 422
    compare: status_and_shape
  - name: a missing field for an existing session is refused
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {backend: claude-sonnet}
    expect_status: 422
    compare: status_and_shape
  - name: request an explanation of a divider whose agent answers empty
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {event_index: 6, backend: claude-sonnet}
    expect_status: 202
  - kind: wait
    name: wait until the empty answer is an error
    timeout_seconds: 30
    until:
      file_field:
        path: sessions/${sessions.explain}/data/explain_results.json
        field: "6.state"
        equals: error
  - name: request an explanation of a divider whose agent exits with an error
    method: POST
    path: /api/sessions/${sessions.explain}/explain
    json: {event_index: 9, backend: claude-sonnet}
    expect_status: 202
  - kind: wait
    name: wait until the failed agent is an error
    timeout_seconds: 30
    until:
      file_field:
        path: sessions/${sessions.explain}/data/explain_results.json
        field: "9.state"
        equals: error
  - name: read the failed divider's entry
    method: GET
    path: /api/sessions/${sessions.explain}/explain
    query: {upto: 9}
    expect_status: 200
  - name: read the stale pending entry, which the read reaps
    method: GET
    path: /api/sessions/${sessions.explain}/explain
    query: {upto: 12}
    expect_status: 200
  - name: read every divider's status after the reap
    method: GET
    path: /api/sessions/${sessions.explain}/explain/status
    expect_status: 200
  - name: HEAD, explain, the POST route names the allow list
    method: HEAD
    path: /api/sessions/${sessions.explain}/explain
    expect_status: 405
  - name: PUT, explain, the POST route names the allow list
    method: PUT
    path: /api/sessions/${sessions.explain}/explain
    expect_status: 405
  - name: HEAD, status, a GET-only route
    method: HEAD
    path: /api/sessions/${sessions.explain}/explain/status
    expect_status: 405
  - name: PUT, status, a GET-only route
    method: PUT
    path: /api/sessions/${sessions.explain}/explain/status
    expect_status: 405
