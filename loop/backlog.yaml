    (4) The dedup-rule line "extract a shared helper only if the shared block is >
    50 lines OR the helper has a clear, single-responsibility name worth its own concept"
    is satisfied by the second clause: the helper name `_should_skip_worktree_cleanup`
    states one question, returns one bool, and consolidates four scattered conditions
    that today only make sense when read together inside a 56-line method body. (5)
    Pending items #125 (`_create_worktree_and_process` dedup), #154 (`spawn_review_worker`
    preflight extraction), and #156 (`finalize_review_chain.thread_mgr` removal) all
    touch the worker/review chain but none of them mutate `_finalize_worker` or its
    skip-cleanup branch ladder, so the three changes can land in any order without
    conflict. (6) Do NOT attempt to also inline `_cleanup_worker_directory` into `_finalize_worker`
    as a "while we''re here" simplification — the cleanup routine has its own try/except
    branches around git_worktree_remove and tempdir rm that form an independent responsibility
