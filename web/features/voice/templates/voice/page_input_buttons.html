              <div class="relative flex items-center">
                <!-- The microphone and its backend caret are one split control. The voice stylesheet sets the caret
                     at the microphone's right edge and its height, so the caret never covers the microphone's
                     pointer target. -->
                <button id="voice-btn" onclick="openVoiceInput()" class="p-2.5 rounded-xl bg-slate-800 border border-slate-600 hover:border-slate-500 transition-colors" title="Voice input">
                  {{ icon('voice', 20, 'block text-slate-400') }}
                </button>
                <button id="voice-backend-btn" onclick="toggleVoiceBackend()" class="p-1.5 rounded-lg bg-slate-800 border border-slate-600 hover:border-slate-500 transition-colors disabled:opacity-40 disabled:cursor-not-allowed" title="Voice backend">
                  {{ icon('disclosure', 12, 'text-slate-400') }}
                </button>
              </div>
