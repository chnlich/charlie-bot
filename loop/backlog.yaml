    vs load_chat_events_tail) and the presence of total_event_count/has_more/event_index_offset
    in the fast path. This means any change to the pipeline (e.g. adding a new parallel
    task, changing error handling, adjusting mark_read behavior) must be applied to
    both functions independently — a maintenance trap that has already produced a
    subtle inconsistency: the fast path computes event_index_offset but the full path
    does not, despite events_to_messages accepting the parameter in both cases. HOW
    — Replace both functions and both dataclasses with a single async def build_session_view_data(session_id,
    session_mgr, thread_mgr, *, tail_limit: int | None = None) -> SessionViewData.
    When tail_limit is None, load all events via load_chat_events_sync (current full
    behavior). When tail_limit is set, use load_chat_events_tail and include total_event_count
    and has_more in the result. Unify SessionViewData and FastSessionViewData into
    a single SessionViewData dataclass with optional total_event_count: int | None
    = None and has_more: bool = False fields. Update the 2 callers: api/pages.py:166
    calls build_session_view_data(session, ...) unchanged; api/sessions.py:252 calls
    build_session_view_data(session_id, ..., tail_limit=200). Delete the FastSessionViewData
