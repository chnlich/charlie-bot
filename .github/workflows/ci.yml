name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'improve/')
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce contract
        run: |
          echo "$BODY" | grep -q '## Evidence' || { echo "PR body missing '## Evidence' section"; exit 1; }
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The formatter config and pin were deleted twice as "unused" (#394, #396).
      # `tools/check-google-style.sh` runs yapf over the tree; without .style.yapf,
      # `yapf --in-place --recursive src/` silently falls back to pep8 defaults
      # and reformats the tree to 4-space indent.
      - name: Formatter config present
        run: |
          test -f .style.yapf || {
            echo "::error file=.style.yapf::.style.yapf is missing — yapf runs against src/"
            echo "and without this file it reformats the tree to 4-space indent."
            exit 1
          }
          grep -q '"yapf' pyproject.toml || {
            echo "::error file=pyproject.toml::the yapf pin is missing from [project.dependencies]"
            exit 1
          }
          grep -q '^indent_width = 2$' .style.yapf || {
            echo "::error file=.style.yapf::indent_width must stay 2 (Google style, per project.md 10.1)"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q -m "not local_only"

  # The image is pinned by name. The live host runs Ubuntu 24.04 with glibc 2.39, and a binary built against a
  # newer glibc does not start there.
  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-build

      # No tests build here. A `cargo test` in the same target directory relinks this binary with the
      # dev-dependency features unified in.
      - name: Build release server and CLI
        working-directory: rust
        run: cargo build --release --locked -p charliebot-server -p charliebot-cli

      - name: Stage binaries and checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir dist
          cp rust/target/release/charliebot-server rust/target/release/charliebot dist/
          (cd dist && sha256sum charliebot charliebot-server > sha256sums.txt)

      - name: Upload server and CLI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: charliebot-server-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.13.1

      # The Rust tests run the Python reference helpers through `uv run python` in this environment.
      - name: Install Python environment
        run: uv sync --locked

      # The terminal tests start tmux.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: rust-test

      - name: Test
        working-directory: rust
        run: cargo test --locked

  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: rust-lint

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format
        working-directory: rust
        run: cargo fmt --check
