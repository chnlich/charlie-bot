stage: session-write
name: session-write-meta
fixture_extras: [session_write_meta]
steps:
  - name: mark unread Cobalt read
    method: POST
    path: /api/sessions/${sessions.cobalt}/read
    expect_status: 200
  - name: mark the same session read again
    method: POST
    path: /api/sessions/${sessions.cobalt}/read
    expect_status: 200
  - name: read a missing session
    method: POST
    path: /api/sessions/${missing_session}/read
    expect_status: 404
  - name: star a session
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/star
    expect_status: 200
  - name: unstar a session
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/unstar
    expect_status: 200
  - name: star a missing session
    method: POST
    path: /api/sessions/${missing_session}/star
    expect_status: 404
  - name: unstar a missing session
    method: POST
    path: /api/sessions/${missing_session}/unstar
    expect_status: 404
  - name: set a session group
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/group
    json: {group: "Write assigned"}
    expect_status: 200
  - name: clear a session group with the Python default
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/group
    json: {}
    expect_status: 200
  - name: HEAD refusal for a session detail target
    method: HEAD
    path: /api/sessions/${extras.session_write_meta.write_session}
    expect_status: 405
  - name: PUT refusal for a session detail target
    method: PUT
    path: /api/sessions/${extras.session_write_meta.write_session}
    expect_status: 405
  - name: HEAD refusal for a session write target
    method: HEAD
    path: /api/sessions/${extras.session_write_meta.write_session}/read
    expect_status: 405
  - name: PUT refusal for a session write target
    method: PUT
    path: /api/sessions/${extras.session_write_meta.write_session}/read
    expect_status: 405
  - name: set the group on a missing session before validating the body
    method: POST
    path: /api/sessions/${missing_session}/group
    json: {group: 1}
    compare: status_and_shape
    expect_status: 422
  - name: set the group with a missing body
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/group
    compare: status_and_shape
    expect_status: 422
  - name: rename a group across both sessions
    method: POST
    path: /api/sessions/groups/rename
    json: {old_name: "Write original", new_name: "Write renamed"}
    expect_status: 200
  - name: rename a group with missing fields
    method: POST
    path: /api/sessions/groups/rename
    json: {}
    compare: status_and_shape
    expect_status: 422
  - name: delete a group across both sessions
    method: POST
    path: /api/sessions/groups/delete
    json: {group: "Write renamed"}
    expect_status: 200
  - name: delete a group with a missing field
    method: POST
    path: /api/sessions/groups/delete
    json: {}
    compare: status_and_shape
    expect_status: 422
  - name: rate a round thumbs up
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/rounds/write-round/rate
    json: {rating: thumbs_up}
    expect_status: 200
  - name: clear a round rating
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/rounds/write-round/rate
    json: {rating: null}
    expect_status: 200
  - name: rate a round with an invalid rating
    method: POST
    path: /api/sessions/${extras.session_write_meta.write_session}/rounds/write-round/rate
    json: {rating: neutral}
    compare: status_and_shape
    expect_status: 422
  - name: rate a missing session before validating the rating
    method: POST
    path: /api/sessions/${missing_session}/rounds/write-round/rate
    json: {rating: neutral}
    compare: status_and_shape
    expect_status: 404
  - name: archive an empty task
    method: POST
    path: /api/sessions/${extras.session_write_meta.archive_session}/archive
    json: {request_id: synthetic-write-meta-archive-empty, summary: Empty task archived., result_refs: [], run_ids: []}
    expect_status: 200
  - name: archive a missing task
    method: POST
    path: /api/sessions/${missing_session}/archive
    json: {request_id: synthetic-write-meta-archive-missing, summary: Missing task., result_refs: [], run_ids: []}
    expect_status: 404
  - name: archive refuses an unresolved run process
    method: POST
    path: /api/sessions/${extras.session_write_meta.queued_archive}/archive
    json: {request_id: synthetic-write-meta-archive-queued, summary: Queued task., result_refs: [], run_ids: []}
    expect_status: 409
  # The agent's session is not a task, so the archive finds no task to judge and answers 404.
  - name: archive refuses an agent caller whose session is not a task
    method: POST
    path: /api/sessions/${extras.session_write_meta.agent_session}/archive
    auth: none
    headers:
      Authorization: "Bearer ${extras.session_write_meta.agent_token}"
    json: {request_id: synthetic-write-meta-archive-agent, summary: Agent task., result_refs: [], run_ids: []}
    expect_status: 404
  - name: archive refuses an invalid run token
    method: POST
    path: /api/sessions/${extras.session_write_meta.archive_session}/archive
    auth: none
    headers:
      Authorization: Bearer invalid-token
    json: {request_id: synthetic-write-meta-archive-token, summary: Invalid token., result_refs: [], run_ids: []}
    expect_status: 401
  - name: permanently delete an empty task
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_session}/permanent
    expect_status: 204
  - name: permanent delete refuses preserved content
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_content}/permanent
    expect_status: 409
  - name: permanent delete refuses a child
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_child_parent}/permanent
    expect_status: 409
  - name: permanent delete refuses a run record
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_run}/permanent
    expect_status: 409
  - name: permanent delete refuses a saved trigger
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_trigger}/permanent
    expect_status: 409
  - name: permanent delete refuses a metadata reference
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_reference}/permanent
    expect_status: 409
  - name: permanent delete refuses a delivered child report
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_report}/permanent
    expect_status: 409
  - name: permanently delete a missing task
    method: DELETE
    path: /api/sessions/${missing_session}/permanent
    expect_status: 404
  - name: permanent delete refuses an agent caller
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.agent_session}/permanent
    auth: none
    headers:
      Authorization: "Bearer ${extras.session_write_meta.agent_token}"
    expect_status: 403
  - name: permanent delete refuses an invalid run token
    method: DELETE
    path: /api/sessions/${extras.session_write_meta.permanent_session}/permanent
    auth: none
    headers:
      Authorization: Bearer invalid-token
    expect_status: 401
