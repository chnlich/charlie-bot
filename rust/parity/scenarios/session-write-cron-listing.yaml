stage: session-write
name: session-write-cron-listing
steps:
  - name: create a cron task bound to an existing manager
    method: POST
    path: /api/cron/tasks
    json:
      name: synthetic-bound-cron
      cron: "0 8 * * *"
      prompt_file: prompts/cron/known_alive.md
      session_id: ${sessions.atlas}
    expect_status: 200
  - name: read a bound row with cron listing fields
    method: GET
    path: /api/sessions/${sessions.atlas}
    expect_status: 200
  - name: read the session listing with cron fields
    method: GET
    path: /api/sessions/
    expect_status: 200
  - name: remove the bound cron task
    method: DELETE
    path: /api/cron/tasks/synthetic-bound-cron
    expect_status: 200
