    ``server.py:113`` for ``close_http_client``; ``server.py`` and ``project.md``
    for ``init_charliebot_home``; FastAPI dispatchers for the route handlers) and
    are not real findings. The >50-line function scan was already enumerated in items
    #154 (``spawn_review_worker``) / #155 (``trigger_master`` swallowed-exception)
    / #157 (``_finalize_worker`` skip-cleanup predicate); the remaining un-filed long
    functions (``_build_worker_prompt``, ``slash.execute_command``, ``autonamer.maybe_auto_name``,
    ``_wait_for_quota_recovery``, ``_dir_listing_html``, ``fork_session``, ``build_review_prompt``,
    ``parse_ndjson_tail``, ``_resolve_worktree_start_point``, ``get_thread_events``,
