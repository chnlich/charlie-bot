    error has already been logged by `spawn_worker_finalize_failed` — losing the nested
    broadcast failure as a structured log warning is the documented best-effort contract.

    Replace L594-617 in `spawn_worker` with:

    ```python   finally:     if thread is not None:       await _finalize_worker_safely(
