- id: '182'
  title: Extract the seek-from-end tail-window raw-line reader from parse_ndjson_tail
  description: 'src/core/ndjson.py:parse_ndjson_tail (L40-91, ~51-line body) is the
    longest function in src/ not already covered by a pending backlog item. It mixes
    three distinct concerns: (1) a forward full-file pass that counts total lines and
    derives has_more/take, (2) a gnarly seek-from-end byte-windowing block (L62-82)
    that reads the trailing 512 KiB window, splits on newlines, drops the partial
    leading line plus any trailing empty, filters blanks, and falls back to a full
    read when the window does not yield enough complete lines, and (3) a JSON parse
    loop (L84-89) that decodes the selected raw lines into events. The middle block
    is the bulk of the weight and is the only tricky part: it has a single clear
    responsibility — "return the last N non-blank raw byte-lines of a file using a
    bounded tail window with a full-read fallback" — which is worth its own concept
    and a clean name, so it clears the extraction bar even though the function is just
    over 50 lines.

    WHAT — Extract L62-82 into a private helper _read_tail_raw_lines(f: BinaryIO,
    take: int, tail_window_size: int = 512 * 1024) -> list[bytes] (or, if passing the
    open handle is awkward, _read_tail_raw_lines(path: Path, take: int) -> list[bytes]
    that opens its own handle) that performs the seek(0, 2)/file_size check, the
    windowed read, the partial-leading-line and trailing-empty trimming, the blank
    filtering, and the short-window full-read fallback, returning the final list of up
    to *take* raw byte-lines. parse_ndjson_tail keeps the total-line count, the
    has_more/take derivation, the call to the helper, and the JSON parse loop, dropping
    its body well under 50 lines and isolating the byte-windowing arithmetic from the
    count and parse phases. Pure structural refactor: identical return tuple (events,
    total, has_more), identical window size, identical fallback behavior, same
    ndjson_tail_parse_skip debug logging on JSONDecodeError.

    HOW — (1) Add _read_tail_raw_lines above parse_ndjson_tail in core/ndjson.py,
    moving L62-82 verbatim (the f.seek(0, 2)/file_size branch, the window split,
    complete_lines = split_lines[1:] trailing-empty trim, the window_lines blank
    filter, the len(window_lines) < take full-read fallback, and the final
    window_lines[-take:] / full-read [-take:] selection). Keep the existing 512 KiB
    constant as a default arg so the value lives in one place. (2) In parse_ndjson_tail
    replace the inlined window block with tail_lines = _read_tail_raw_lines(f, take)
    (passing the already-open handle keeps the single-open contract; the forward count
    pass must run first since it leaves the cursor at EOF and the helper re-seeks
    anyway). (3) Verify: yapf --in-place --recursive src/ produces no diff (or commit
    it per the yapf rule); pyflakes src/core/ndjson.py is clean; and behavior is
    unchanged on three cases — a file smaller than the window (full-read path), a file
    larger than the window with enough complete lines in the window (window path), and
