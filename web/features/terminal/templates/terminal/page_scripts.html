  <script>
    // The terminal's four scripts register its tab and mount xterm. A reader who never opens a terminal never needs
    // them, so its tab button loads them on the first click and the switch then finds the tab registered. The four
    // arrive in dependency order: the base64 codec, the clipboard wiring, the shared mount, and the panel that
    // registers the tab.
    globalThis.openTerminalTab = function() {
      loadPageScripts('terminal', [
        '/static/features/terminal/terminal_b64.js',
        '/static/features/terminal/terminal_clipboard.js',
        '/static/features/terminal/terminal_mount.js',
        '/static/features/terminal/terminal_panel.js',
      ]).then(() => switchTab('terminal')).catch((error) => console.error(error));
    };
  </script>
