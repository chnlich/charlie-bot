- id: '168'
  title: Split _create_worktree_and_process in core/spawner.py into per-mode helpers
  description: 'core/spawner.py:_create_worktree_and_process (L277-392, 116 lines)
    is the longest function in src/ not already covered by a pending or done backlog
    item. It contains three mutually exclusive branches selected by SpawnRequest
