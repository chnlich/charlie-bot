stage: other-backends
name: other-backends-openai-proxy
config:
  backends:
    options:
      - id: claude-glm52
        label: CC GLM-5.2
        type: cc-openai-compatible
        model: nvidia/GLM-5.2-NVFP4
        api_base: https://openai-compatible.parity.test/v1
        credential: upstream
      - id: claude-no-credential
        label: CC without the upstream key
        type: cc-openai-compatible
        model: nvidia/GLM-5.2-NVFP4
        api_base: https://openai-compatible.parity.test/v1
        credential: absent_upstream
      - id: claude-no-base
        label: CC without an api_base
        type: cc-openai-compatible
        model: nvidia/GLM-5.2-NVFP4
        api_base: ""
      - id: claude-no-model
        label: CC without a model
        type: cc-openai-compatible
        model: ""
        api_base: https://openai-compatible.parity.test/v1
      - id: claude-other-type
        label: a backend of another type
        type: cc-claude
        model: synthetic-model
credentials:
  upstream:
    api_key: sk-parity-synthetic-upstream
fakes:
  openai_compatible: {}
steps:
  - name: HEAD is refused by the proxy route
    method: HEAD
    path: /api/anthropic-proxy/openai-compatible/claude-glm52/v1/messages
    expect_status: 405
  - name: PUT is refused by the proxy route
    method: PUT
    path: /api/anthropic-proxy/openai-compatible/claude-glm52/v1/messages
    expect_status: 405
  - name: non-stream answer through the proxy
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-glm52/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      system: Be brief.
      messages:
        - role: user
          content: hi
    expect_status: 200
  - name: stream answer through the proxy
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-glm52/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      stream: true
      messages:
        - role: user
          content: hi
    expect_status: 200
  - name: upstream failure keeps its status and detail
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-glm52/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      messages:
        - role: user
          content: synthetic-upstream-failure
    expect_status: 503
  - name: unknown backend id is 404
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-missing/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      messages:
        - role: user
          content: hi
    expect_status: 404
  - name: backend of another type is 400
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-other-type/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      messages:
        - role: user
          content: hi
    expect_status: 400
  - name: backend without api_base is 400
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-no-base/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      messages:
        - role: user
          content: hi
    expect_status: 400
  - name: backend without a model is 400
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-no-model/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      messages:
        - role: user
          content: hi
    expect_status: 400
  - name: non-JSON body is 400
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-glm52/v1/messages
    body_file: audio/not-wave.bin
    expect_status: 400
    compare: status_and_shape
  - name: missing upstream credential is 400
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-no-credential/v1/messages
    json:
      model: claude-facing
      max_tokens: 16
      messages:
        - role: user
          content: hi
    expect_status: 400
  - name: proxy without the access key
    method: POST
    path: /api/anthropic-proxy/openai-compatible/claude-glm52/v1/messages
    auth: none
    json:
      model: claude-facing
      max_tokens: 16
      messages:
        - role: user
          content: hi
