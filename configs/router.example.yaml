# The router's own configuration — read by `charliebot router` on every backend choice, so an edit
# takes effect at the next choice with no restart. Copy it to your charliebot home as router.yaml
# (<charliebot home>/router.yaml) and fill in the address for this host.
#
# The Jev key is not here: `jev.credential` names a section of credentials.yaml, and the router reads
# that section's api_key. Never commit a filled-in router.yaml.
#
# Fields:
#   jev.url         the choice endpoint, POSTed one JSON body per call
#   jev.model       the model name the endpoint takes
#   jev.credential  the credentials.yaml section holding this router's key
#   instructions    the one question Jev answers
#   classes         each class of work: `when` is the criterion Jev reads for it, and `run_on` is where
#                   the work runs: `session` (the delegating session's backend), or one backends.options
#                   or backends.pools id
#   roles           each role that routes, with the ordered list of class names it chooses among; a
#                   role this file does not list is not routed. A role with one class needs no Jev call.
#
# A `run_on` id answers only when the request offers it as a candidate. Every `run_on` id must be a
# backends.options or backends.pools id of config.yaml; the router refuses the file otherwise.

jev:
  # Placeholder: your gateway's choice endpoint.
  url: https://jev.example.com/v1/systemone
  model: jev-latest
  credential: jev
instructions: Which class of CharlieBot work is this? Choose routine unless the work clearly meets the condition of another class.
classes:
  routine:
    when: Default. Fixes a bug, adds tests, changes config, runs a script or a job, queries or counts state, follows a written plan or an approved design, lands reviewed work, or revises a page to close review or cold-read findings.
    run_on: cheap
  context:
    when: A first read of unfamiliar material, a diagnosis of an unexplained failure, an explanation of a mechanism or a cause (an explain or debugging page included), an understanding page, or a design or plan draft (a new plan version that changes the design included).
    run_on: session
  operations:
    when: "Directly execute mutating writes against live shared clusters or shared hosts: moving nodes between clusters; modifying Kubernetes or Slurm state (reservations, partitions, cordons, drains); installing software on shared cluster nodes (cluster installs followed by acceptance checks included); or directly running kubectl, helm, or helmfile applies. Exclude GitHub pull request merges, CI/CD rollouts, local CharlieBot releases and restarts, local container/KIND testing, job submissions, and read-only inspections (which remain routine or context)."
    run_on: claude-opus-5
roles:
  implement: [routine, context, operations]
  quick-edit: [routine, context, operations]
  script-run: [routine, context, operations]
