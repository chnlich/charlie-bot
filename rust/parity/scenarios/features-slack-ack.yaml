stage: features
name: features-slack-ack
fixture_extras: [slack_ack]
config:
  slack:
    allowed_user_ids: [U0PARITY]
credentials:
  slack:
    bot_token: xoxb-parity-synthetic-token
    app_token: xapp-parity-synthetic-token
fakes:
  slack:
    thread_messages:
      - {user: U0PARITY, ts: "1767600000.003100", text: "the summon itself"}
      - {user: U0PARITY, ts: "1767600000.003200", text: "first follow up"}
      - {user: U0PARITY, bot_id: B_TEST, ts: "1767600000.003250", text: "bot noise"}
      - {user: U_OTHER, ts: "1767600000.003275", text: "lurker"}
      - {user: U0PARITY, ts: "1767600000.003300", text: "second follow up"}
steps:
  - name: refuse an ack that skips an eligible Slack message
    method: POST
    path: /api/internal/slack/ack
    json:
      session_id: ${extras.slack_ack.session}
      message_ids: ["1767600000.003300"]
    expect_status: 422
  - name: acknowledge every eligible follow message
    method: POST
    path: /api/internal/slack/ack
    json:
      session_id: ${extras.slack_ack.session}
      message_ids: ["1767600000.003200", "1767600000.003300"]
    expect_status: 200
  - name: repeat the same ack idempotently
    method: POST
    path: /api/internal/slack/ack
    json:
      session_id: ${extras.slack_ack.session}
      message_ids: ["1767600000.003200", "1767600000.003300"]
    expect_status: 200
