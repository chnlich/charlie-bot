# Repo-owned default scheduled tasks. The server seeds each missing entry on every start into
# its own host file $CHARLIEBOT_HOME/config.d/cron.d/<name>.yaml (the job `name`
# becomes the file name, and the host file body carries no `name` key), and
# never touches a file that is already there. Host files own the schedule. The
# bound session owns the backend and the group, so no entry names a task-level
# backend or a group.
#
# The scheduler creates a task's session on the first tick that binds it. The
# session starts in no group. Agents change task settings through /api/cron,
# and the session page shows them.
#
# The prompt source of every task is exactly one of `prompt_file`, `steps`,
# or `handler`. `steps` is an ordered worker list: each step declares
# `name`, `prompt_file`, and an optional `backend` (a step without one runs on
# the bound session's backend), starts after the previous step exits 0 with that
# step's result, and the session master is woken once at the end with one
# summary block per step.
scheduled_tasks:
  - name: memory-curator
    cron: "27 6 * * *"
    timezone: local
    steps:
      - name: selector
        prompt_file: prompts/cron/memory_curator/memory_selector.md
        backend: claude-opus
      - name: reviewer
        prompt_file: prompts/cron/memory_curator/memory_reviewer.md
        backend: claude-fable
        # The reviewer runs on a different model from the drafter it reviews.
        # Both steps of the pair carry their own backend. These ids name
        # options of configs/config.example.yaml. The seed writes this file only
        # when the host config holds them.
        distinct_backend_from: selector
  - name: storage-cool
    cron: "30 4 * * *"
    timezone: local
    handler: cool_storage
  # `mode` sets the input a fire gives the bound session. `master` sends the
  # task's prompt; an absent mode sends the task's name and its category
  # template, and the session decides the round. The scheduler binds the
  # session on the first tick and writes its `session_id` into the seeded
  # host file.
  - name: proactive-agent
    cron: "0 7 * * *"
    prompt_file: prompts/cron/proactive_agent/prompt.md
    mode: master
