[project]
name = "charlie-bot"
version = "0.1.0"
description = "Self-hosted multi-agent orchestration system: master/worker/reviewer agents on pluggable LLM CLI backends, operated through a web UI"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "croniter>=6.2.2",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "orjson>=3.11.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "sherpa-onnx>=1.13.4",
    # sherpa-onnx-core ships libonnxruntime.so; sherpa-onnx's PyPI sdist omits
    # the dependency, so uv's universal resolution would drop it without this
    # direct requirement. Keep the pin matched to the resolved sherpa-onnx.
    "sherpa-onnx-core==1.13.4",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.42.0",
    "websockets>=16.0",
    "yapf>=0.43.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
]
# Optional GPU voice engine (qwen3_hf): official transformers Qwen3-ASR weights on
# NVIDIA GPUs. Not installed by default — setup.sh syncs this group only on hosts
# with nvidia-smi, so plain `uv sync` and CI never pull torch.
gpu-voice = [
    "torch",
    "transformers>=5.13",
]

[project.scripts]
charliebot = "src.cli.main:main"
claude-sub = "src.cli.claude_sub:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "local_only: requires host-local resources (GPU, tailnet, local services, installed local binaries); CI runs -m 'not local_only'",
]

[tool.ruff.lint]
# B008 stays out: function-call-in-default-argument is FastAPI's Depends idiom.
# B027 stays out: the AgentBackend no-op hooks are deliberate optional overrides.
# DTZ005 stays out: backup.py's datetime.now() calls are deliberate local time —
#   the backup filename timestamp and the retention age against local-time filenames.
# ERA001 stays out: base.py's wire-format examples in comments parse as code.
# FBT001/FBT002 stay out: bool positional parameters in definitions are the repo's
#   normal shape; only a literal True/False at a call site must name its parameter (FBT003).
# FLY002 stays out: the one flagged join lists its disallowed tools one per line.
# PLW0108 stays out: the flagged lambdas defer evaluation on purpose (stub seams).
# SIM300 stays out: the subset assertions read best with the named constant left.
# SLOT000 stays out: _Instructions assigns instance attributes, so __slots__ = () breaks it.
# UP046/UP047 stay out: yapf's pinned lib2to3 parser rejects PEP 695 type-parameter
#   lists, which would make the whole tree unparseable to `yapf -r`
#   (the same constraint src/core/process.py records on its TypeVar).
select = [
    "E4", "E7", "E9", "F", "I",
    "A001", "A002",
    "B007", "B009", "B905",
    "C409", "C416", "C420",
    "FBT003",
    "FURB110", "FURB167", "FURB188",
    "ISC004",
    "N818",
    "PERF401",
    "PGH003",
    "PIE807",
    "PLR0402", "PLR1714", "PLR1716",
    "PYI025", "PYI034", "PYI036", "PYI041",
    "RET501",
    "RUF005", "RUF007", "RUF023", "RUF043", "RUF059",
    "SIM102", "SIM105", "SIM108", "SIM109", "SIM117",
    "UP012", "UP031", "UP032", "UP035", "UP037",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.ruff]
line-length = 120
