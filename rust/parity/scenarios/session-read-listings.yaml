# The session listings: the sidebar lists, the archive pages, the tree pages, the status poll and search.
stage: session-read-api
name: session-listings
steps:
  - name: active list
    method: GET
    path: /api/sessions/
    expect_status: 200
  - name: HEAD, active list
    method: HEAD
    path: /api/sessions/
    expect_status: 405
  - name: active list, gzip accepted
    method: GET
    path: /api/sessions/
    headers:
      Accept-Encoding: gzip
    expect_status: 200
  - name: archived, every group
    method: GET
    path: /api/sessions/archived
    expect_status: 200
  - name: archived, group Writing
    method: GET
    path: /api/sessions/archived
    query: {group: Writing}
    expect_status: 200
  - name: archived, a group with no archived session
    method: GET
    path: /api/sessions/archived
    query: {group: Research}
    expect_status: 200
  - name: archived, first page of one
    method: GET
    path: /api/sessions/archived
    query: {limit: 1}
    capture: {before: next_before, before_id: next_before_id}
    expect_status: 200
  - name: archived, second page of one
    method: GET
    path: /api/sessions/archived
    query: {limit: 1, before: "${capture.before}", before_id: "${capture.before_id}"}
    expect_status: 200
  - name: starred
    method: GET
    path: /api/sessions/starred
    expect_status: 200
  - name: groups
    method: GET
    path: /api/sessions/groups
    expect_status: 200
  - name: tree, roots
    method: GET
    path: /api/sessions/tree
    expect_status: 200
  - name: tree, roots with archived
    method: GET
    path: /api/sessions/tree
    query: {include_archived: true}
    expect_status: 200
  - name: tree, children of the atlas manager
    method: GET
    path: /api/sessions/tree
    query: {parent_id: "${sessions.atlas}"}
    expect_status: 200
  - name: tree, workers of the survey manager with archived
    method: GET
    path: /api/sessions/tree
    query: {parent_id: "${sessions.atlas_survey}", include_archived: true}
    expect_status: 200
  - name: tree, workers of the survey manager without archived
    method: GET
    path: /api/sessions/tree
    query: {parent_id: "${sessions.atlas_survey}"}
    expect_status: 200
  - name: tree, children of an archived root
    method: GET
    path: /api/sessions/tree
    query: {parent_id: "${sessions.beacon}", include_archived: true}
    expect_status: 200
  - name: tree, first page of two
    method: GET
    path: /api/sessions/tree
    query: {limit: 2, include_archived: true}
    capture: {cursor: next_cursor}
    expect_status: 200
  - name: tree, second page of two
    method: GET
    path: /api/sessions/tree
    query: {limit: 2, include_archived: true, cursor: "${capture.cursor}"}
    expect_status: 200
  - name: tree, children of a missing id
    method: GET
    path: /api/sessions/tree
    query: {parent_id: "${missing_session}"}
  - name: tree, limit below the floor
    method: GET
    path: /api/sessions/tree
    query: {limit: 0}
    expect_status: 422
    compare: status_and_shape
  - name: status, every fixture session and a missing id
    method: GET
    path: /api/sessions/status
    query:
      ids: "${sessions.atlas},${sessions.atlas_survey},${sessions.atlas_notes},${sessions.atlas_probe},\
        ${sessions.atlas_scout},${sessions.beacon},${sessions.beacon_draft},${sessions.cobalt},${sessions.delta},\
        ${sessions.ember},${sessions.fable},${sessions.garnet},${missing_session}"
    expect_status: 200
  - name: status, the same ids again (memo)
    method: GET
    path: /api/sessions/status
    query:
      ids: "${sessions.atlas},${sessions.atlas_survey},${sessions.atlas_notes},${sessions.atlas_probe},\
        ${sessions.atlas_scout},${sessions.beacon},${sessions.beacon_draft},${sessions.cobalt},${sessions.delta},\
        ${sessions.ember},${sessions.fable},${sessions.garnet},${missing_session}"
    expect_status: 200
  - name: status, forced, duplicate ids
    method: GET
    path: /api/sessions/status
    query: {ids: "${sessions.cobalt}, ${sessions.fable},${sessions.cobalt}", force: true}
    expect_status: 200
  - name: status, empty ids
    method: GET
    path: /api/sessions/status
    query: {ids: " , "}
    expect_status: 422
    compare: status_and_shape
  - name: status, no ids
    method: GET
    path: /api/sessions/status
    expect_status: 422
    compare: status_and_shape
  - name: search, a name
    method: GET
    path: /api/sessions/search
    query: {q: Atlas}
    expect_status: 200
  - name: search, chat content
    method: GET
    path: /api/sessions/search
    query: {q: pigment}
    expect_status: 200
  - name: search, blank query
    method: GET
    path: /api/sessions/search
    query: {q: "  "}
    expect_status: 200
  - name: search, no query
    method: GET
    path: /api/sessions/search
    expect_status: 200
  - name: search, no match
    method: GET
    path: /api/sessions/search
    query: {q: zzz-no-session-matches}
    expect_status: 200
  - name: chat threads
    method: GET
    path: /api/sessions/chat-threads
    expect_status: 200
