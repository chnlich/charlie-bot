# Server A terminates the OpenCode turn process. Server B reconciles the unfinished run without a second start.
stage: agent-orchestration
name: handover-opencode
config:
  backends:
    options:
      - id: opencode-synthetic
        label: Synthetic OpenCode
        type: opencode
        model: fakeprov/fake-model
        proxy_url: null
fake_agent:
  starts:
    - name: opencode
      steps:
        - emit:
            type: session.text.delta
            data: {assistantMessageID: synthetic-assistant, ordinal: 0, delta: The OpenCode turn is held for handover.}
        - gate: opencode-turn
      exit_code: 0
expect_starts: 1
directions: [python-to-candidate, candidate-to-python]
steps:
  - name: send a manager message to OpenCode
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {content: Start the synthetic OpenCode handover turn., request_id: synthetic-chat-handover-opencode}
    capture: {input_id: input_event_id}
    expect_status: 202
    defer_files: true
  - kind: wait
    name: wait until the OpenCode API fake reaches its turn gate
    timeout_seconds: 30
    until: {at_gate: opencode-turn}
  - kind: handover
    name: hand over the terminated OpenCode turn to server B
    agent_after_stop: terminated
  - kind: wait
    name: wait for server B to reconcile the OpenCode run
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.delta}
        type: run_finished
        fields: {input_event_ids: ["${capture.input_id}"]}
