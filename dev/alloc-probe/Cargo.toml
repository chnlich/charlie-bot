[package]
name = "alloc-probe"
version = "0.0.0"
edition = "2024"
publish = false

# A standalone maintenance probe, not a workspace member: it builds with its own lock file.
[workspace]

[[bin]]
name = "alloc-probe"
path = "src/main.rs"

[features]
# Each feature selects one global allocator; with none selected the probe runs on glibc malloc.
mimalloc = ["dep:mimalloc"]
# The server's configuration: mimalloc with its purge delay at zero, set by the same option call the server's
# allocator module makes (rust/crates/app/server/src/allocator.rs).
mimalloc-purge0 = ["mimalloc", "dep:libmimalloc-sys"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
serde_json = "1"
mimalloc = { version = "0.1", optional = true }
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }
tikv-jemallocator = { version = "0.6", optional = true }
