stage: agent-orchestration
name: handover-worker-run
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-worker-adopted}
        - gate: worker-run-adoption
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The adopted worker run finished.}]
        - emit:
            type: result
            result: The adopted worker run finished.
            usage: {input_tokens: 3, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
expect_starts: 1
directions: [python-to-candidate, candidate-to-python]
steps:
  - name: delegate a repo-less worker whose agent will stay alive through handover
    method: POST
    path: /api/internal/delegate
    json:
      session_id: ${sessions.cobalt}
      description: Keep this synthetic worker alive through server adoption.
      task_type: script-run
      backend: claude-sonnet
      request_id: synthetic-worker-live-handover
    capture: {child: session_id, run: run_id}
    expect_status: 200
    defer_files: true
  - kind: wait
    name: wait for the worker agent at its live gate
    timeout_seconds: 30
    until: {at_gate: worker-run-adoption}
  - kind: handover
    name: hand over the live worker run
    agent_after_stop: alive
  - kind: gate
    name: release the adopted worker agent
    open: worker-run-adoption
  - kind: wait
    name: wait for the adopted worker run to finish
    timeout_seconds: 30
    until:
      event:
        session: ${capture.child}
        type: run_finished
        fields: {run_id: "${capture.run}", outcome: success}
