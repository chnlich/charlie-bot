[package]
name = "charliebot-agents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake cgroup hierarchy this crate's tests share with the Devin backend's tests. Off by default; only the
# dev-dependencies turn it on, so a production build compiles none of it.
test-support = ["cgfs/test-utils"]

[dependencies]
anyhow.workspace = true
cgfs.workspace = true
charliebot-core.workspace = true
charliebot-registry.workspace = true
charliebot-store.workspace = true
futures-util.workspace = true
libc.workspace = true
memchr = "2"
mime-db.workspace = true
nix.workspace = true
regex.workspace = true
serde_json.workspace = true
serde.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
which.workspace = true

[dev-dependencies]
charliebot-agents = { path = ".", features = ["test-support"] }
charliebot-anthropic-compatible.workspace = true
charliebot-antigravity.workspace = true
charliebot-charlie-code.workspace = true
charliebot-claude-code.workspace = true
charliebot-codex.workspace = true
charliebot-core = { workspace = true, features = ["test-support"] }
charliebot-gemini.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true
