[project]
name = "charlie-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "anyio>=4.13.0",
    "croniter>=6.2.2",
    "fastapi>=0.135.2",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.42.0",
    "websockets>=16.0",
    "yapf>=0.43.0",
]

[project.scripts]
charliebot = "src.cli.main:main"
claude-sub = "src.cli.claude_sub:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
