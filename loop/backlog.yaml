    (L236-239), sum the required and optional achieved-work metrics into
    achieved_work_flop_per_cycle (L241-247), derive achieved FLOP/s, arithmetic
    intensity, and the compute/memory ceilings, and append the cleaned point dict
    (L252-263). That inner block is a self-contained, single-responsibility unit with
    a clean name and clears the extraction bar (a ~40-line block with a nameable
    concept, not a three-line snippet).

    WHAT — Extract the inner per-kernel block into a private helper
    _roofline_point_for_kernel(kernel: dict, definition: dict, required_metric_names:
    list[str]) -> dict | None that returns the point dict, or None when the kernel
    should be skipped (missing required metric or non-positive peak/clock/traffic
    value). _collect_roofline then becomes the outer per-definition loop: build
    required_metric_names, call the helper for each kernel, collect the non-None
    points, and do the existing per-definition aggregation (L265-275) plus the final
