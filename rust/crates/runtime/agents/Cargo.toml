[package]
name = "charliebot-agents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# `test-utils` gives the tests' fake cgroup trees a hierarchy constructor; the server never calls it.
cgfs = { workspace = true, features = ["test-utils"] }
charliebot-core.workspace = true
charliebot-registry.workspace = true
charliebot-store.workspace = true
futures-util.workspace = true
libc.workspace = true
memchr = "2"
mime-db.workspace = true
nix.workspace = true
regex.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
which.workspace = true

[dev-dependencies]
charliebot-anthropic-compatible.workspace = true
charliebot-antigravity.workspace = true
charliebot-charlie-code.workspace = true
charliebot-claude-code.workspace = true
charliebot-codex.workspace = true
# `python_json_cross_implementation` compares the crate's Python-json parity against the shared form.
charliebot-compat.workspace = true
charliebot-core = { workspace = true, features = ["test-support"] }
charliebot-gemini.workspace = true
