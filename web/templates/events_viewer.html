{% include 'partials/prologue.html' %}
  <title>Events — {{ session.name }} — CharlieBot@{{ hostname }}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css?v={{ static_asset_version|urlencode }}">
  <style>
    /* Scrollbar: standard properties keep the scroller on the compositor thread */
    * { scrollbar-width: thin; scrollbar-color: #475569 transparent; }

    /* JSON syntax highlighting */
    .json-key    { color: #7dd3fc; }  /* sky-300 */
    .json-str    { color: #86efac; }  /* green-300 */
    .json-num    { color: #fda4af; }  /* rose-300 */
    .json-bool   { color: #fdba74; }  /* orange-300 */
    .json-null   { color: #94a3b8; }  /* slate-400 */

    /* Event type badge colours */
    .badge-user      { background: #1d4ed8; color: #bfdbfe; }
    .badge-assistant { background: #166534; color: #bbf7d0; }
    .badge-master_done { background: #14532d; color: #86efac; }
    .badge-result    { background: #713f12; color: #fde68a; }
    .badge-task_delegated { background: #581c87; color: #e9d5ff; }
    .badge-worker_summary { background: #4c1d95; color: #ddd6fe; }
    .badge-assistant_error { background: #7f1d1d; color: #fca5a5; }
    .badge-ping      { background: #1e293b; color: #94a3b8; }
    .badge-default   { background: #1e293b; color: #94a3b8; }

    .event-row { border-bottom: 1px solid #1e293b; }
    .event-row:last-child { border-bottom: none; }
    .event-row:hover { background: #0f172a; }

    /* A token too long for the line breaks anywhere, so hashes, paths and base64 stay inside the
       page; ordinary words keep their shape and the line breaks at the spaces between them. */
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }

    /* The page's secondary text reads in the slate-400 tone. The row index and time drew slate-600,
       2.36:1 on the slate-900 row; the header's labels drew slate-500, 3.42:1 on slate-850, and
       the filter's placeholder drew slate-600 on slate-800, 1.93:1. slate-400 renders 6.96:1,
       6.34:1 and 5.71:1 on those backgrounds, above the 4.5:1 floor for 12px text. The type
       badges keep their own colours, with every one of them at or above that floor. */

    /* A phone cannot fit these two rows at their desktop width. The header gives
       the title a row of its own so a whole session name shows, and keeps the
       icon-only download action and the count on its first row. The divider that
       separates Back from the title leaves with the title, so no bare separator
       hangs after Back. The filter bar keeps its label and input on the first row
       and moves "Expand all" and "Clear" to a second row rather than squeezing
       that row. */
    @media (max-width: 768px) {
      .events-download-label { display: none; }
      .events-filter { flex-wrap: wrap; }
      .events-topbar { flex-wrap: wrap; }
      .events-topbar h1 { flex: 1 1 100%; order: 1; }
      .events-topbar .events-download { margin-left: auto; }
      .events-topbar .events-back-sep { display: none; }
    }
  </style>
</head>
<body class="dark bg-slate-900 text-slate-100 min-h-screen">

  <!-- The top bar and the filter bar are one sticky block with an opaque background. A sticky
       offset on the filter bar alone leaves a gap under the header. A translucent layer lets
       the event rows scrolling underneath show through the filter's own controls. -->
  <div class="sticky top-0 z-10 bg-slate-900">
    <!-- Top bar -->
    <header class="events-topbar bg-slate-850 border-b border-slate-700 flex items-center gap-3 px-4 py-3">
      <a href="/?session={{ session_id }}"
         class="flex items-center gap-1.5 text-slate-400 hover:text-slate-200 transition-colors text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
      <div class="events-back-sep h-4 w-px bg-slate-700"></div>
      <h1 class="text-sm font-semibold text-slate-200 truncate flex-1">
        <span class="text-slate-400 mr-1">Events:</span>{{ session.name }}
      </h1>
      <a href="{{ events_url }}" download aria-label="Download JSONL"
         class="events-download flex items-center gap-1.5 text-xs text-slate-400 hover:text-slate-300 transition-colors px-2 py-1 rounded border border-slate-700 hover:border-slate-600">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span class="events-download-label">Download JSONL</span>
      </a>
      <span id="event-count" class="text-xs text-slate-400"></span>
      {% include 'partials/concurrency_badge.html' %}
    </header>

    <!-- Filter bar -->
    <div class="events-filter border-b border-slate-800 px-4 py-2 flex items-center gap-3 bg-slate-900">
      <label class="text-xs text-slate-400">Filter by type:</label>
      <input id="type-filter"
             type="text"
             placeholder="e.g. user, assistant, result …"
             class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-500 text-slate-300 placeholder-slate-400 w-48">
      <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer select-none">
        <input id="expand-all" type="checkbox" class="accent-blue-500">
        Expand all
      </label>
      <button onclick="clearFilter()"
              class="text-xs text-slate-400 hover:text-slate-300 transition-colors">Clear</button>
    </div>
  </div>

  <!-- Earlier events: the page loads the log's tail first, so a large log does not hold the first screen -->
  <div id="earlier-bar" class="hidden px-4 py-2 border-b border-slate-800">
    <button id="load-earlier"
            class="text-xs text-slate-400 hover:text-slate-200 transition-colors px-2 py-1 rounded border border-slate-700 hover:border-slate-600">
      Load earlier events
    </button>
  </div>

  <!-- Event list -->
  <div id="event-list" class="divide-y divide-slate-800/60">
    <!-- populated by JS -->
  </div>

  <!-- Loading / error states -->
  <div id="loading" class="flex items-center justify-center py-16 text-slate-500 text-sm gap-2">
    <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    Loading events…
  </div>
  <div id="error-msg" class="hidden text-center py-16 text-red-400 text-sm"></div>
  <div id="empty-msg" class="hidden text-center py-16 text-slate-500 text-sm">No events found.</div>

  <script src="/static/js/json-highlight.js?v={{ static_asset_version|urlencode }}"></script>
  <script>
    // -------------------------------------------------------------------------
    // Constants
    // -------------------------------------------------------------------------
    const EVENTS_URL = {{ events_url|tojson }};
    // The events one request loads: the page shows the newest first, so a log of gigabytes does not
    // hold the first screen.
    const EVENTS_PAGE = 200;

    // -------------------------------------------------------------------------
    // Badge colour for event type
    // -------------------------------------------------------------------------
    function badgeStyle(type) {
      const known = [
        'user', 'assistant', 'master_done', 'result',
        'task_delegated', 'worker_summary', 'assistant_error', 'ping',
      ];
      const cls = known.includes(type) ? `badge-${type}` : 'badge-default';
      return cls;
    }

    // -------------------------------------------------------------------------
    // State
    // -------------------------------------------------------------------------
    let allEvents = [];
    let expandAll = false;
    // The byte offset where the loaded window starts; 0 means the whole log is loaded.
    let windowStart = 0;
    let loadingEarlier = false;

    // -------------------------------------------------------------------------
    // Row summary
    // -------------------------------------------------------------------------
    // A row previews its event on one line: the string content, the description, or the first
    // message block that carries text — a typed answer, a tool call, or a tool result. A tool
    // call or a tool result otherwise shows its badges alone, so a reader cannot tell what ran.
    const PREVIEW_CHARS = 120;

    function toolResultText(content) {
      if (typeof content === 'string') return content;
      if (!Array.isArray(content)) return '';
      return content.filter(b => b && b.type === 'text' && b.text).map(b => b.text).join(' ');
    }

    function blockSummary(block) {
      if (!block || typeof block !== 'object') return '';
      if (block.type === 'text') return block.text || '';
      if (block.type === 'tool_use') {
        const input = block.input === undefined ? '' : JSON.stringify(block.input);
        return [block.name || 'tool', input].filter(Boolean).join(' ');
      }
      if (block.type === 'tool_result') return toolResultText(block.content);
      return '';
    }

    function summaryText(ev) {
      if (typeof ev.content === 'string') return ev.content;
      if (typeof ev.description === 'string') return ev.description;
      const blocks = ev.message && Array.isArray(ev.message.content) ? ev.message.content : [];
      for (const block of blocks) {
        const text = blockSummary(block);
        if (text) return text;
      }
      return '';
    }

    // The one-line preview: whitespace collapsed, cut at PREVIEW_CHARS with an ellipsis so a cut
    // preview reads as cut rather than as the event's whole text.
    function previewText(ev) {
      const text = summaryText(ev).replace(/\s+/g, ' ').trim();
      return text.length > PREVIEW_CHARS ? text.slice(0, PREVIEW_CHARS) + '…' : text;
    }

    // The event's time: a `ts` epoch in seconds, or the ISO `timestamp` most event types write.
    function eventTime(ev) {
      if (typeof ev.ts === 'number') return new Date(ev.ts * 1000);
      if (typeof ev.timestamp === 'string') {
        const parsed = new Date(ev.timestamp);
        if (!Number.isNaN(parsed.getTime())) return parsed;
      }
      return null;
    }

    function timeText(time) {
      const pad = n => String(n).padStart(2, '0');
      return `${pad(time.getHours())}:${pad(time.getMinutes())}:${pad(time.getSeconds())}`;
    }

    // -------------------------------------------------------------------------
    // Render
    // -------------------------------------------------------------------------
    function renderEvents(events) {
      const list = document.getElementById('event-list');
      list.innerHTML = '';

      if (!events.length) {
        document.getElementById('empty-msg').classList.remove('hidden');
        return;
      }
      document.getElementById('empty-msg').classList.add('hidden');

      events.forEach((ev, idx) => {
        const row = document.createElement('div');
        row.className = 'event-row px-4 py-2.5 cursor-pointer';
        row.dataset.idx = idx;

        const type = ev.type || 'unknown';
        const badgeCls = badgeStyle(type);
        const time = eventTime(ev);
        const summary = previewText(ev);

        row.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs font-mono text-slate-400 w-8 flex-shrink-0 text-right">${idx + 1}</span>
            <span class="text-xs px-1.5 py-0.5 rounded font-mono flex-shrink-0 ${badgeCls}">${escapeHtml(type)}</span>
            ${time ? `<span class="text-xs text-slate-400 flex-shrink-0 font-mono">${timeText(time)}</span>` : ''}
            <span class="event-preview text-xs text-slate-400 truncate"></span>
          </div>
          <div class="json-body ${expandAll ? '' : 'hidden'} mt-2 ml-10">
            <pre class="text-xs bg-slate-800 rounded p-3 overflow-x-auto leading-5">${syntaxHighlight(ev)}</pre>
          </div>`;
        // A preview is a tool's input or output, so it enters the row as text and never as markup.
        row.querySelector('.event-preview').textContent = summary;

        row.addEventListener('click', () => {
          const body = row.querySelector('.json-body');
          body.classList.toggle('hidden');
        });

        list.appendChild(row);
      });
    }

    // The header count names the rows on screen: the filter's result, and the
    // singular noun for a lone event. While earlier events remain unloaded, the
    // count says that it covers the loaded part of the log.
    function updateEventCount(count) {
      const loaded = windowStart > 0 ? ' loaded' : '';
      document.getElementById('event-count').textContent = `${count}${loaded} ${count === 1 ? 'event' : 'events'}`;
    }

    function filterEvents() {
      const q = document.getElementById('type-filter').value.trim().toLowerCase();
      const filtered = q
        ? allEvents.filter(ev => (ev.type || '').toLowerCase().includes(q))
        : allEvents;
      renderEvents(filtered);
      updateEventCount(filtered.length);
      applyExpandAll();
    }

    function applyExpandAll() {
      document.querySelectorAll('.json-body').forEach(el => {
        if (expandAll) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    }

    function clearFilter() {
      document.getElementById('type-filter').value = '';
      filterEvents();
    }

    // -------------------------------------------------------------------------
    // Fetch JSONL
    // -------------------------------------------------------------------------
    function parseEvents(text) {
      return text.split('\n').filter(l => l.trim()).map(line => {
        try {
          return JSON.parse(line);
        } catch (err) {
          return { type: 'parse_error', raw: line, error: err.message };
        }
      });
    }

    // The byte offset where the served window starts. A server without the window header served the
    // whole log, so nothing earlier is left to load.
    function windowStartOf(res) {
      const value = Number(res.headers.get('x-window-start'));
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function updateEarlierBar() {
      document.getElementById('earlier-bar').classList.toggle('hidden', !(windowStart > 0));
    }

    async function loadEvents() {
      try {
        const res = await fetch(EVENTS_URL + '?tail=' + EVENTS_PAGE);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        windowStart = windowStartOf(res);
        allEvents = parseEvents(await res.text());

        document.getElementById('loading').classList.add('hidden');
        updateEarlierBar();
        filterEvents();
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        const errEl = document.getElementById('error-msg');
        errEl.textContent = 'Failed to load events: ' + err.message;
        errEl.classList.remove('hidden');
      }
    }

    // Prepend the events before the loaded window. The scroll offset is kept on the first row that was
    // on screen, so the reader stays where they were while earlier rows arrive above.
    async function loadEarlier() {
      if (loadingEarlier || !(windowStart > 0)) return;
      loadingEarlier = true;
      const button = document.getElementById('load-earlier');
      button.disabled = true;
      button.textContent = 'Loading…';
      const before = windowStart;
      const previousHeight = document.documentElement.scrollHeight;
      try {
        const res = await fetch(EVENTS_URL + '?tail=' + EVENTS_PAGE + '&before=' + before);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        const earlier = parseEvents(await res.text());
        windowStart = windowStartOf(res);
        allEvents = earlier.concat(allEvents);
        filterEvents();
        window.scrollBy(0, document.documentElement.scrollHeight - previousHeight);
        document.getElementById('error-msg').classList.add('hidden');
      } catch (err) {
        const errEl = document.getElementById('error-msg');
        errEl.textContent = 'Failed to load earlier events: ' + err.message;
        errEl.classList.remove('hidden');
      } finally {
        loadingEarlier = false;
        button.disabled = false;
        button.textContent = 'Load earlier events';
        updateEarlierBar();
      }
    }

    // -------------------------------------------------------------------------
    // Wire up controls
    // -------------------------------------------------------------------------
    document.getElementById('type-filter').addEventListener('input', filterEvents);
    document.getElementById('load-earlier').addEventListener('click', loadEarlier);

    document.getElementById('expand-all').addEventListener('change', (e) => {
      expandAll = e.target.checked;
      applyExpandAll();
    });

    // -------------------------------------------------------------------------
    // Boot
    // -------------------------------------------------------------------------
    loadEvents();
  </script>
</body>
</html>
