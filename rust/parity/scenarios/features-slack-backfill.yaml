stage: features
name: features-slack-backfill
fixture_extras: [slack_backfill]
config:
  slack:
    allowed_user_ids: [U0PARITY]
credentials:
  slack:
    bot_token: xoxb-parity-synthetic-token
    app_token: xapp-parity-synthetic-token
fakes:
