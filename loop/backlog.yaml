    relay, _run_cc invocation, MASTER_DONE done_event construction and broadcast,
    queue-recheck-after-await race-window guard, RUNNING_CHANGED restore-thinking
    branch (L355-366), RUNNING_CHANGED idle-declared branch (L367-378), and the item.future.set_result/set_exception
    resolution. Reviewers reading _session_consumer must hold ~80 lines of per-item
