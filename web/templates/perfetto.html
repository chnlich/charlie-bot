<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Trace" }} — Perfetto — CharlieBot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #172033; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-shrink: 0; }
    #topbar .trace-name { font-size: 14px; font-weight: 500; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #topbar a { color: #7dd3fc; font-size: 13px; text-decoration: none; white-space: nowrap; }
    #topbar a:hover { text-decoration: underline; }
    #topbar .spacer { flex: 1; }
    #topbar .warn { color: #fbbf24; font-size: 13px; }
    #status { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 15px; color: #94a3b8; }
    #status.error { color: #fca5a5; }
    #perfetto-iframe { flex: 1; border: none; width: 100%; display: none; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="trace-name">{{ title }}</span>
    <span class="warn">{{ warn or "" }}</span>
    <span class="spacer"></span>
    <a href="#" id="open-new-tab">Open in new tab</a>
  </div>

  <div id="status">
    {% if is_merge %}
      Merging {{ merge_count }} {{ "trace" if merge_count == 1 else "traces" }} on the server… 0s
    {% elif is_direct_pass %}
      Preparing a single trace on the server… 0s
    {% else %}
      Downloading trace…
    {% endif %}
  </div>
  <iframe id="perfetto-iframe" allow="cross-origin-isolated"></iframe>

  <script>
    const PERFETTO_UI = 'https://ui.perfetto.dev';
    const traceUrl = {{ trace_url | tojson }};
    const traceTitle = {{ title | tojson }};
    const mergeCount = {{ merge_count | tojson }};
    const isMerge = {{ is_merge | tojson }};
    const isDirectPass = {{ is_direct_pass | tojson }};

    const statusEl = document.getElementById('status');
    const iframeEl = document.getElementById('perfetto-iframe');
    const openNewTabLink = document.getElementById('open-new-tab');
    let traceBuffer = null;

    function showError(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add('error');
    }

    function updateStatus(msg) {
      statusEl.textContent = msg;
    }

    function formatMB(bytes) {
      return (bytes / (1024 * 1024)).toFixed(1);
    }

    async function fetchTrace() {
      if (isMerge || isDirectPass) {
        const traceLabel = mergeCount === 1 ? 'trace' : `${mergeCount} traces`;
        const phase = isMerge ? `Merging ${traceLabel} on the server` : 'Preparing a single trace on the server';
        const started = Date.now();
        updateStatus(`${phase}… 0s`);
        const tick = setInterval(() => {
          updateStatus(`${phase}… ${Math.floor((Date.now() - started) / 1000)}s`);
        }, 1000);
        try {
          const buffer = await downloadTrace();
          return buffer;
        } finally {
          clearInterval(tick);
        }
      }
      updateStatus('Downloading trace…');
      return downloadTrace();
    }

    async function downloadTrace() {
      const resp = await fetch(traceUrl);
      if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${traceTitle}`);

      const total = Number(resp.headers.get('Content-Length') || 0);
      let received = 0;
      const updateDownloadStatus = () => {
        if (total > 0) {
          updateStatus(`Downloading ${formatMB(received)} / ${formatMB(total)} MB`);
        } else {
          updateStatus(`Downloading ${formatMB(received)} MB`);
        }
      };
      const reader = resp.body.getReader();
      const chunks = [];
      updateDownloadStatus();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.byteLength;
        updateDownloadStatus();
      }
      const body = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) {
        body.set(chunk, offset);
        offset += chunk.byteLength;
      }
      return body.buffer;
    }

    async function loadTrace() {
      try {
        return await fetchTrace();
      } catch (error) {
        showError(`Error: ${error.message}`);
        return null;
      }
    }

    function sendToPerfetto(target, buffer, origin) {
      let pingInterval = null;

      const onMessage = (evt) => {
        if (evt.data !== 'PONG') return;
        window.removeEventListener('message', onMessage);
        if (pingInterval) clearInterval(pingInterval);

        target.postMessage({
          perfetto: {
            buffer: buffer,
            title: traceTitle,
          }
        }, origin);
      };

      window.addEventListener('message', onMessage);

      pingInterval = setInterval(() => {
        target.postMessage('PING', origin);
      }, 50);
    }

    function loadInIframe(buffer) {
      statusEl.style.display = 'none';
      iframeEl.style.display = 'block';
      iframeEl.src = PERFETTO_UI;

      iframeEl.addEventListener('load', () => {
        sendToPerfetto(iframeEl.contentWindow, buffer, PERFETTO_UI);
      });
    }

    openNewTabLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const buf = traceBuffer || await loadTrace();
      if (!buf) return;
      const win = window.open(PERFETTO_UI);
      if (!win) {
        showError('Error: popup blocked. Please allow popups for this site.');
        return;
      }
      sendToPerfetto(win, buf, PERFETTO_UI);
    });

    (async () => {
      traceBuffer = await loadTrace();
      if (!traceBuffer) return;
      loadInIframe(traceBuffer);
    })();
  </script>
</body>
</html>
