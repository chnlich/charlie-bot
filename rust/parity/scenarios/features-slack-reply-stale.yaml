stage: features
name: features-slack-reply-stale
fixture_extras: [slack]
config:
  slack:
    allowed_user_ids: [U0PARITY]
credentials:
  slack:
    bot_token: xoxb-parity-synthetic-token
    app_token: xapp-parity-synthetic-token
fakes:
  slack:
    thread_messages:
      - {user: U0PARITY, ts: "1767600000.001100", text: "new follow up"}
steps:
  - name: refuse a reply while the Slack thread is stale
    method: POST
    path: /api/internal/slack/reply
    json:
      session_id: ${extras.slack.session}
      text: Do not post while the thread is stale.
    expect_status: 412
