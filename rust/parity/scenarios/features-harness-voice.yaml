stage: features
name: features-harness-voice
credentials:
  gemini:
    api_key: gemini-parity-synthetic-key
  meta:
    model_api_key: muse-parity-synthetic-key
fakes:
  gemini:
    transcript: Synthetic Gemini transcript.
  muse:
    transcript: Synthetic Muse transcript.
steps:
  - kind: ws
    name: Gemini live transcription
    path: /ws/voice/${sessions.atlas}
    query: {backend: gemini}
    send:
      - binary_file: audio/silence.pcm
      - json: {type: end}
    collect:
      where: {type: final}
      field: text
      decode: none
    until: {collected_contains: Synthetic Gemini transcript.}
    timeout_seconds: 15
    compare: {collected_contains: [Synthetic Gemini transcript.]}
  - kind: ws
    name: Muse live transcription
    path: /ws/voice/${sessions.atlas}
    query: {backend: muse}
    send:
      - binary_file: audio/silence.pcm
      - json: {type: end}
    collect:
      where: {type: final}
      field: text
      decode: none
    until: {collected_contains: Synthetic Muse transcript.}
    timeout_seconds: 15
    compare: {collected_contains: [Synthetic Muse transcript.]}
