    (for example, changing the commit-message guidance, adding a "do not push" note,
    or renaming the "## Task" section) must be applied to both branches in lockstep
    or the two worker types will silently diverge. It is exactly the kind of dual-branch
    prompt template that caused bugs in the master/worker compact_boundary handling
    (fixed by item 017) and in the session-toggle methods (fixed by item 002). Not
    covered by existing items 021/061/062 which split the surrounding spawn_worker
    function into phases but left the internal string duplication intact, nor by item
    087 which only reported yapf formatting issues in this function. HOW — (1) Pull
    out a local `intro_line` variable that switches on is_continuation: "You are continuing
    work in an existing worktree from a previous iteration. Review previous iteration
    changes before starting." when True, "A dedicated git worktree is already created
    for you." when False. (2) Collapse the two 13-14 line f-string branches into a
