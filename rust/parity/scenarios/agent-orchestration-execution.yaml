stage: agent-orchestration
name: manager-turn-execution-and-routes
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-manager-message}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic manager turn finished.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-queued-manager}
        - gate: first-manager-turn
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: First synthetic turn finished.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-queued-manager-second}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: Second synthetic turn finished.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-retry-manager}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The retried synthetic manager turn finished.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-status-reminder-exec-1}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: Status reviewed at the end of the scenario.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
expect_starts: 5
steps:
  - name: HEAD is refused by the chat message route
    method: HEAD
    path: /api/chat/${sessions.delta}/message
    expect_status: 405
  - name: PUT is refused by the chat message route
    method: PUT
    path: /api/chat/${sessions.delta}/message
    expect_status: 405
  - name: HEAD is refused by the chat cancel route
    method: HEAD
    path: /api/chat/${sessions.delta}/cancel
    expect_status: 405
  - name: PUT is refused by the chat cancel route
    method: PUT
    path: /api/chat/${sessions.delta}/cancel
    expect_status: 405
  - name: HEAD is refused by the retry route
    method: HEAD
    path: /api/sessions/${sessions.atlas}/retry
    expect_status: 405
  - name: PUT is refused by the retry route
    method: PUT
    path: /api/sessions/${sessions.atlas}/retry
    expect_status: 405
  - name: HEAD is refused by the run cancel route
    method: HEAD
    path: /api/sessions/${sessions.atlas}/runs/${runs.atlas_t3.run}/cancel
    expect_status: 405
  - name: PUT is refused by the run cancel route
    method: PUT
    path: /api/sessions/${sessions.atlas}/runs/${runs.atlas_t3.run}/cancel
    expect_status: 405
  - name: send a manager message
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {content: Continue the synthetic Ember plan., request_id: synthetic-chat-manager-message}
    capture: {message_input: input_event_id}
    expect_status: 202
    defer_files: true
  - kind: wait
    name: wait for the manager turn to finish
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.delta}
        type: run_finished
        fields: {input_event_ids: ["${capture.message_input}"]}
  - name: send the first manager message for the gated turn
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {content: Start the gated synthetic task., request_id: synthetic-chat-first-manager}
    capture: {first_input: input_event_id}
    expect_status: 202
    defer_files: true
  - kind: wait
    name: wait at the first manager gate
    timeout_seconds: 30
    until: {at_gate: first-manager-turn}
  - name: send another manager message during the turn
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {content: Queue this while the first turn runs., request_id: synthetic-chat-second-manager}
    capture: {second_input: input_event_id}
    expect_status: 202
    defer_files: true
  - kind: gate
    name: release the first manager turn
    open: first-manager-turn
  - kind: wait
    name: wait for the queued manager turn to finish
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.delta}
        type: run_finished
        fields: {input_event_ids: ["${capture.second_input}"]}
  - name: retry a failed manager run
    method: POST
    path: /api/sessions/${sessions.atlas}/retry
    json: {request_id: synthetic-manager-retry, run_id: "${runs.atlas_t3.run}"}
    capture: {retry_run_id: run_id}
    expect_status: 200
    defer_files: true
  - kind: wait
    name: wait for the retried manager run to finish
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.atlas}
        type: run_finished
        fields: {run_id: "${capture.retry_run_id}"}
  - name: retry an unknown run
    method: POST
    path: /api/sessions/${sessions.atlas}/retry
    json: {request_id: synthetic-unknown-retry, run_id: "${missing_run}"}
    expect_status: 404
  - name: malformed chat-message JSON returns FastAPI json_invalid shape
    method: POST
    path: /api/chat/${sessions.delta}/message
    headers: {content-type: application/json}
    body_file: generate_silence.py
    expect_status: 422
    compare: status_and_shape
  - name: chat-message content uses the Python string field
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {content: 42, request_id: synthetic-chat-invalid-content}
    expect_status: 422
    compare: status_and_shape
  - name: chat-message content is required by the Python model
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {request_id: synthetic-chat-missing-content}
    expect_status: 422
    compare: status_and_shape
  - name: chat-message content and uploaded_files both fail validation
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {content: 42, uploaded_files: [{filename: 42, path: synthetic-path}], request_id: synthetic-chat-invalid-files}
    expect_status: 422
    compare: status_and_shape
  - name: malformed chat-message JSON wins over a missing session
    method: POST
    path: /api/chat/${missing_session}/message
    headers: {content-type: application/json}
    body_file: generate_silence.py
    expect_status: 422
    compare: status_and_shape
  - name: malformed retry JSON returns FastAPI json_invalid shape
    method: POST
    path: /api/sessions/${sessions.atlas}/retry
    headers: {content-type: application/json}
    body_file: generate_silence.py
    expect_status: 422
    compare: status_and_shape
  - name: retry request_id uses the Python string field
    method: POST
    path: /api/sessions/${sessions.atlas}/retry
    json: {request_id: 42, run_id: synthetic-run}
    expect_status: 422
    compare: status_and_shape
  - name: retry request_id is required by the Python model
    method: POST
    path: /api/sessions/${sessions.atlas}/retry
    json: {run_id: synthetic-run}
    expect_status: 422
    compare: status_and_shape
  - name: malformed retry JSON wins over a missing session
    method: POST
    path: /api/sessions/${missing_session}/retry
    headers: {content-type: application/json}
    body_file: generate_silence.py
    expect_status: 422
    compare: status_and_shape
  - name: malformed run-cancel JSON returns FastAPI json_invalid shape
    method: POST
    path: /api/sessions/${sessions.atlas}/runs/${runs.atlas_t3.run}/cancel
    headers: {content-type: application/json}
    body_file: generate_silence.py
    expect_status: 422
    compare: status_and_shape
  - name: run-cancel request_id uses the Python string field
    method: POST
    path: /api/sessions/${sessions.atlas}/runs/${runs.atlas_t3.run}/cancel
    json: {request_id: 42}
    expect_status: 422
    compare: status_and_shape
  - name: run-cancel request_id is required by the Python model
    method: POST
    path: /api/sessions/${sessions.atlas}/runs/${runs.atlas_t3.run}/cancel
    json: {}
    expect_status: 422
    compare: status_and_shape
  - name: malformed run-cancel JSON wins over a missing session
    method: POST
    path: /api/sessions/${missing_session}/runs/synthetic-run/cancel
    headers: {content-type: application/json}
    body_file: generate_silence.py
    expect_status: 422
    compare: status_and_shape
