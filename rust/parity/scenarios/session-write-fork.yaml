# The fork and elone routes against the quiet fork_source worker, whose chat log holds 13 lines (indexes 0 to 12). The fork
# runs at a null index, the first, a middle, the last line, and past the end. The elone refuses past the end before it
# takes over at a middle index, because a successful elone archives its source. Each accepted call starts one fake claude
# run with the successor's bootstrap prompt as its only input, and each call's run is waited out before the next step.
# Each successor is a manager root, a web session, and the web-reply round-end audit posts a nudge after a clean turn.
# The nudge races the turn's run_finished in the log, and the Rust port does not run that audit yet (PORT_STATUS), so
# every successor run exits 1: the audit runs only after a clean turn, on both servers.
stage: session-write
name: session-write-fork
fixture_extras: [fork_source]
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-successor}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic successor is ready.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 1
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-successor}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic successor is ready.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 1
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-successor}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic successor is ready.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 1
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-successor}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic successor is ready.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 1
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-successor}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic successor is ready.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 1
expect_starts: 5
steps:
  - name: fork of the source at a null index, the whole log
    method: POST
    path: /api/sessions/${sessions.fork_source}/fork
    json: {event_index: null}
    capture: {fork_null: id}
    expect_status: 200
  - kind: wait
    name: wait for the null-index fork's bootstrap run to finish
    timeout_seconds: 30
    until:
      event: {session: "${capture.fork_null}", type: run_finished}
  - name: fork of the source at its first line
    method: POST
    path: /api/sessions/${sessions.fork_source}/fork
    json: {event_index: 0}
    capture: {fork_first: id}
    expect_status: 200
  - kind: wait
    name: wait for the first-line fork's bootstrap run to finish
    timeout_seconds: 30
    until:
      event: {session: "${capture.fork_first}", type: run_finished}
  - name: fork of the source at a middle line
    method: POST
    path: /api/sessions/${sessions.fork_source}/fork
    json: {event_index: 6}
    capture: {fork_middle: id}
    expect_status: 200
  - kind: wait
    name: wait for the middle-line fork's bootstrap run to finish
    timeout_seconds: 30
    until:
      event: {session: "${capture.fork_middle}", type: run_finished}
  - name: fork of the source at its last line
    method: POST
    path: /api/sessions/${sessions.fork_source}/fork
    json: {event_index: 12}
    capture: {fork_last: id}
    expect_status: 200
  - kind: wait
    name: wait for the last-line fork's bootstrap run to finish
    timeout_seconds: 30
    until:
      event: {session: "${capture.fork_last}", type: run_finished}
  - name: fork of the source past the end of its log refuses
    method: POST
    path: /api/sessions/${sessions.fork_source}/fork
    json: {event_index: 13}
    expect_status: 400
  - name: elone of the source past the end of its log refuses before it archives the source
    method: POST
    path: /api/sessions/${sessions.fork_source}/elone
    json: {event_index: 13}
    expect_status: 400
  - name: elone of the source at a middle line takes over and archives the source
    method: POST
    path: /api/sessions/${sessions.fork_source}/elone
    json: {event_index: 6}
    capture: {elone_middle: id}
    expect_status: 200
  - kind: wait
    name: wait for the elone successor's bootstrap run to finish
    timeout_seconds: 30
    until:
      event: {session: "${capture.elone_middle}", type: run_finished}
