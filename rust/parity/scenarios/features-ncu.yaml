stage: features
name: features-ncu
fixture_extras: [ncu_reports]
steps:
  - name: parsed report renders its kernels
    method: GET
    path: /ncu
    query: {file: "${tree.root}/${extras.ncu_reports.parsed}"}
    expect_status: 200
  - name: cached repeat renders the same page
    method: GET
    path: /ncu
    query: {file: "${tree.root}/${extras.ncu_reports.parsed}"}
    expect_status: 200
  - name: report with no kernels is unprocessable
    method: GET
    path: /ncu
    query: {file: "${tree.root}/${extras.ncu_reports.empty}"}
    expect_status: 422
  - name: no file is a bad request
    method: GET
    path: /ncu
    expect_status: 400
  - name: relative path is a bad request
    method: GET
    path: /ncu
    query: {file: "workspace/ncu/parsed.ncu-rep"}
    expect_status: 400
  - name: missing report is not found
    method: GET
    path: /ncu
    query: {file: "${tree.root}/${extras.ncu_reports.missing}"}
    expect_status: 404
  - name: refused report is unprocessable
    method: GET
    path: /ncu
    query: {file: "${tree.root}/${extras.ncu_reports.refused}"}
    expect_status: 422
  - name: head is not allowed
    method: HEAD
    path: /ncu
    expect_status: 405
  - name: put is not allowed
    method: PUT
    path: /ncu
    expect_status: 405
