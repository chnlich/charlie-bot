name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  contract-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'improve/')
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce contract
        run: |
          echo "$BODY" | grep -q '## Evidence' || { echo "PR body missing '## Evidence' section"; exit 1; }
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The no-Python guard: a tracked .py file, a Python shebang, a Python-naming line in scripts or CI
      # configuration and a Python-naming line in prompts, skills or docs all fail the job. It needs git alone, so it
      # runs before the installs.
      - name: Reject Python
        run: dev/check-no-python.sh

      # The suites that parse JavaScript (sucrase) or build Tailwind resolve devDependencies from node_modules;
      # installing up front keeps the installs the suites run themselves at no-op speed.
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      # One suite per web/tests/*.test.{js,mjs} file on disk: the glob is the single source, so a suite file that
      # lands runs here without a registration edit. The bound turns a hung runner into a step failure instead
      # of a CI hang.
      - name: Test
        working-directory: web
        run: |
          suites=$(find tests -maxdepth 1 \( -name '*.test.js' -o -name '*.test.mjs' \) | sort)
          count=$(printf '%s\n' "$suites" | grep -c .)
          echo "Running $count node suite files"
          [ "$count" -gt 0 ]
          timeout 780 node --test $suites

  # The image is pinned by name. The live host runs Ubuntu 24.04 with glibc 2.39, and a binary built against a
  # newer glibc does not start there.
  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-build

      # No tests build here. A `cargo test` in the same target directory relinks this binary with the
      # dev-dependency features unified in.
      - name: Build release server and CLI
        working-directory: rust
        run: cargo build --release --locked -p charliebot-server -p charliebot-cli

      - name: Stage binaries and checksums
        run: |
          mkdir dist
          cp rust/target/release/charliebot-server rust/target/release/charliebot dist/
          (cd dist && sha256sum charliebot charliebot-server > sha256sums.txt)

      - name: Upload server and CLI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: charliebot-server-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # A manual run on a task branch keeps its binaries for the shortest retention GitHub allows: the
      # branch-binary script downloads them within minutes, and the unlanded branch code should not outlive
      # that need.
      - name: Upload server and CLI binaries (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: charliebot-server-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  rust-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The terminal tests start tmux, the release tests' gh stub applies gh's --jq with jq, and the
      # failure-triage tests rank LESSONS entries with rg.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: rust-test

      # nextest runs each test in its own process and writes a JUnit report with a per-test `time`
      # attribute; `cargo test` cannot report per-test times on stable Rust. Pinned to one version,
      # installed from the prebuilt binary so the install takes seconds and stays reproducible.
      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/0.9.150/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      - name: Test
        working-directory: rust
        run: cargo nextest run --locked --profile ci

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-junit
          path: rust/target/nextest/ci/junit.xml
          retention-days: 30
          if-no-files-found: error

      # This stage only reports offenders. The stage that enforces the 0.1 s rule, once the over-limit
      # unit tests are handled, drops --fail-over-limit 0 so the check gates on its default.
      - name: Unit tests over 0.1 s
        if: always()
        run: dev/check-unit-test-time.mjs --junit rust/target/nextest/ci/junit.xml --fail-over-limit 0

      # Doc-tests carry no per-test time, so a doc-test that runs dodges the 0.1 s rule: the step fails
      # when `cargo test --doc` runs any, and names each. Today zero doc-tests run.
      - name: No doc-tests run
        working-directory: rust
        run: |
          set +e
          cargo test --doc --locked > /tmp/doc-tests.txt 2>&1
          rc=$?
          set -e
          cat /tmp/doc-tests.txt
          if [ "$rc" -ne 0 ]; then
            echo "cargo test --doc failed" >&2
            exit 1
          fi
          ran=$(grep -E '^test .* \.\.\. (ok|FAILED|bench)' /tmp/doc-tests.txt || true)
          if [ -n "$ran" ]; then
            echo "doc-tests carry no per-test time, so none may run; these ran:" >&2
            echo "$ran" >&2
            exit 1
          fi
          echo "0 doc-tests ran"

      # A script test that leaves a stand-in behind reparents it to pid 1. Run after a failed test too, which is
      # exactly when a leak appears.
      - name: Check for leaked script-test processes
        if: always()
        run: |
          prefix=/tmp/charliebot-script-
          leaked=""
          for entry in /proc/[0-9]*/stat; do
            pid=${entry#/proc/}
            pid=${pid%/stat}
            ppid=$(sed 's/^.*) //' "$entry" 2>/dev/null | cut -d' ' -f2)
            [ "$ppid" = "1" ] || continue
            if tr '\0' '\n' < "/proc/$pid/cmdline" 2>/dev/null | grep -q "^${prefix}"; then
              leaked="$leaked $pid"
            fi
          done
          if [ -n "$leaked" ]; then
            echo "leaked script-test processes:$leaked" >&2
            for pid in $leaked; do
              printf '  %s: %s\n' "$pid" "$(tr '\0' ' ' < "/proc/$pid/cmdline")" >&2
            done
            exit 1
          fi

  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: rust-lint

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format
        working-directory: rust
        run: cargo fmt --check
