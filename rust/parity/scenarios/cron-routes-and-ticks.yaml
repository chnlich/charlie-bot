stage: triggers-cron-improve
name: cron-routes-and-ticks
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-cron-manual}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic manual cron firing completed.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 5, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-cron-manual-manager}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic manual cron report was received.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 5, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-status-reminder-after-cron-report}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: Status reviewed after the cron report.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 5, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-cron-tick}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic scheduled cron firing completed.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 5, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-cron-tick-manager}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic scheduled cron report was received.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 5, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-status-reminder-cron-tick-1}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: Status reviewed at the end of the scenario.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
expect_starts: 6
steps:
  - name: malformed create body keeps the FastAPI validation identity
    method: POST
    path: /api/cron/tasks
    json: {name: synthetic-cron, cron: 7, prompt_file: prompts/cron/known_alive.md}
    expect_status: 422
    compare: status_and_shape
  - name: create a prompt-backed cron task
    method: POST
    path: /api/cron/tasks
    json:
      name: synthetic-cron
      cron: "* * * * *"
      prompt_file: prompts/cron/known_alive.md
    expect_status: 200
  - name: list the created cron task
    method: GET
    path: /api/cron/tasks
    expect_status: 200
  - name: malformed update body keeps the FastAPI validation identity
    method: PUT
    path: /api/cron/tasks/synthetic-cron
    json: {enabled: []}
    expect_status: 422
    compare: status_and_shape
  - name: update the cron task and write its file
    method: PUT
    path: /api/cron/tasks/synthetic-cron
    json: {project: "Synthetic cron", allow_failure: true}
    expect_status: 200
  - name: fire the task through its manual run route
    method: POST
    path: /api/cron/tasks/synthetic-cron/run
    json: {}
    capture: {session_id: session_id}
    expect_status: 202
    defer_files: true
  - kind: wait
    name: wait for the manual cron firing report
    timeout_seconds: 40
    until:
      event:
        session: ${capture.session_id}
        type: child_report
  - kind: wait
    name: wait for a scheduler tick to fire the same task again
    timeout_seconds: 180
    until:
      event:
        session: ${capture.session_id}
        type: child_report
        count: 2
  - name: delete the cron file and keep the manager node
    method: DELETE
    path: /api/cron/tasks/synthetic-cron
    expect_status: 200
  - name: missing task deletion returns 404
    method: DELETE
    path: /api/cron/tasks/synthetic-missing
    expect_status: 404
