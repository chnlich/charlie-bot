      <div id="backlog-resize-handle" class="resize-handle" style="display:none"></div>

      <!-- ===== BACKLOG PANEL ===== -->
      <div id="backlog-panel" class="hidden flex flex-col bg-gray-900 border-l border-gray-700 overflow-hidden" style="width: 40%">
        <div class="flex items-center justify-between px-4 py-2 border-b border-gray-700 bg-gray-800">
          <select id="backlog-repo-selector" onchange="backlogPanel.switchRepo(this.value)"
                  class="text-sm font-medium bg-gray-800 text-gray-300 rounded px-2 py-1 border border-gray-600 focus:outline-none"></select>
          <div class="flex gap-2 items-center">
            <button onclick="backlogPanel.refresh()" class="text-xs text-gray-400 hover:text-white transition-colors">Refresh</button>
            <select id="backlog-module-filter" onchange="backlogPanel.render()" class="text-xs bg-gray-700 text-gray-300 rounded px-2 py-1 border border-gray-600 focus:outline-none">
              <option value="all">All modules</option>
            </select>
            <select id="backlog-filter" onchange="backlogPanel.render()" class="text-xs bg-gray-700 text-gray-300 rounded px-2 py-1 border border-gray-600 focus:outline-none">
              <option value="pending">Active</option>
              <option value="all">All</option>
              <option value="done">Done</option>
              <option value="rejected">Rejected</option>
              <option value="failed">Failed</option>
            </select>
          </div>
        </div>
        <div id="backlog-list" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
      </div>
