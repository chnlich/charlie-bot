- id: '106'
  title: Introduce utc_now helper and delete the stale dataclasses.field import in
    core/models.py
  description: 'PURPOSE — Eliminate the last remaining UTC-datetime duplication in
    the pydantic layer and clear a pyflakes-flagged dead import, so every "current
    timestamp" decision in the codebase funnels through one obvious function alongside
    the already-centralized ensure_utc / parse_utc_datetime helpers added by items
    086 and 099. Today src/core/models.py repeats `default_factory=lambda: datetime.now(timezone.utc)`
    verbatim 5 times (L68 ThreadMetadata.created_at, L97 PendingTrigger.created_at,
    L133 SessionMetadata.created_at, L134 SessionMetadata.updated_at, L176 WorkerEvent.timestamp).
    In addition, `datetime.now(timezone.utc)` is open-coded 11 more times across core/sessions.py
    (L253, L303, L328, L420, L439, L525, L698), core/threads.py (L86), core/improve_command.py
    (L243, L313), and core/init.py (L127). Each site carries a small risk of drifting
