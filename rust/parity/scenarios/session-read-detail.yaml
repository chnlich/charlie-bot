# One session's reads over every fixture kind and a missing id: the detail, the bootstrap, the usage roll-up,
# the rendered event pages and the raw event log.
stage: session-read-api
name: session-detail
steps:
  - name: events viewer page
    method: GET
    path: /sessions/${sessions.atlas}/events
    expect_status: 200
  - name: events viewer page with a missing session
    method: GET
    path: /sessions/${missing_session}/events
    expect_status: 404
  - name: detail, manager root, starred, grouped
    method: GET
    path: /api/sessions/${sessions.atlas}
    expect_status: 200
  - name: HEAD, detail, manager root, starred, grouped
    method: HEAD
    path: /api/sessions/${sessions.atlas}
    expect_status: 405
  - name: bootstrap, manager root, starred, grouped
    method: GET
    path: /api/sessions/${sessions.atlas}/bootstrap
    expect_status: 200
  - name: usage, manager root, starred, grouped
    method: GET
    path: /api/sessions/${sessions.atlas}/usage
    expect_status: 200
  - name: PUT, usage, manager root, starred, grouped
    method: PUT
    path: /api/sessions/${sessions.atlas}/usage
    expect_status: 405
  - name: events, newest page, manager root, starred, grouped
    method: GET
    path: /api/sessions/${sessions.atlas}/events
    query: {before: 100000}
    expect_status: 200
  - name: events.jsonl, manager root, starred, grouped
    method: GET
    path: /api/sessions/${sessions.atlas}/events.jsonl
    expect_status: 200
  - name: events.jsonl, gzip accepted, manager root, starred, grouped
    method: GET
    path: /api/sessions/${sessions.atlas}/events.jsonl
    headers:
      Accept-Encoding: gzip
    expect_status: 200
  - name: detail, manager child with child reports
    method: GET
    path: /api/sessions/${sessions.atlas_survey}
    expect_status: 200
  - name: bootstrap, manager child with child reports
    method: GET
    path: /api/sessions/${sessions.atlas_survey}/bootstrap
