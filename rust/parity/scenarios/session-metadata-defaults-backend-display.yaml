stage: session-read-api
name: session-metadata-defaults-backend-display
fixture_extras: [usage_quota_accounts]
steps:
  - name: detail fills defaults for absent legacy metadata slots
    method: GET
    path: /api/sessions/${sessions.atlas}
    expect_status: 200
  - name: bootstrap fills defaults for absent legacy metadata slots
    method: GET
    path: /api/sessions/${sessions.atlas}/bootstrap
    expect_status: 200
  - name: usage fills defaults for absent legacy metadata slots
    method: GET
    path: /api/sessions/${sessions.atlas}/usage
    expect_status: 200
  - name: active listing fills defaults for absent legacy metadata slots
    method: GET
    path: /api/sessions/
    expect_status: 200
  - name: starred listing fills defaults for absent legacy metadata slots
    method: GET
    path: /api/sessions/starred
    expect_status: 200
  - name: chat-thread listing fills defaults for absent legacy metadata slots
    method: GET
    path: /api/sessions/chat-threads
    expect_status: 200
  - name: manager ignores a retired newest-run backend after restart
    method: GET
    path: /api/sessions/${sessions.atlas}/bootstrap
    expect_status: 200
  - name: manager usage ignores a retired newest-run backend after restart
    method: GET
    path: /api/sessions/${sessions.atlas}/usage
    expect_status: 200
  - name: worker displays its retired newest-run backend after restart
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/bootstrap
    expect_status: 200
  - name: worker usage displays its retired newest-run backend after restart
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/usage
    expect_status: 200
