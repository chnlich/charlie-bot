[project]
name = "charlie-bot"
version = "0.1.0"
description = "Self-hosted multi-agent orchestration system: master/worker/reviewer agents on pluggable LLM CLI backends, operated through a web UI"
requires-python = "==3.14.*"
dependencies = [
    "aiofiles>=25.1.0",
    "croniter>=6.2.2",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "isal>=1.8.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "orjson>=3.11.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "sherpa-onnx>=1.13.4",
    # sherpa-onnx-core ships libonnxruntime.so; sherpa-onnx's PyPI sdist omits
    # the dependency, so uv's universal resolution would drop it without this
    # direct requirement. Keep the pin matched to the resolved sherpa-onnx.
    "sherpa-onnx-core==1.13.4",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.42.0",
    "websockets>=16.0",
    "yapf>=0.43.0",
]

[dependency-groups]
dev = [
    "pylint-google-style==0.1.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff==0.16.1",
]
# Optional GPU voice engine (qwen3_hf): official transformers Qwen3-ASR weights on
# NVIDIA GPUs. Not installed by default — setup.sh syncs this group only on hosts
# with nvidia-smi, so plain `uv sync` and CI never pull torch.
gpu-voice = [
    "torch",
    "transformers>=5.13",
]

[project.scripts]
charliebot = "src.app.main:main"
claude-sub = "src.backends.claude_sub.claude_sub:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Print the slowest tests on every run (CI included) so budget drift stays visible without a workflow change.
addopts = "--durations=0 --durations-min=0.3"
markers = [
    "local_only: requires host-local resources (GPU, tailnet, local services, installed local binaries); CI runs -m 'not local_only'",
    "integration: needs real processes or real time; per-test budget 10s (unit default 2s) and at most 50 collected - tests/conftest.py enforces all three",
]
# Enforced by tests/conftest.py; a test of the mechanism shrinks these in its own ini.
unit_test_budget_seconds = 2.0
integration_test_budget_seconds = 10.0
max_integration_tests = 50

[tool.ruff.lint]
# B008 stays out: function-call-in-default-argument is FastAPI's Depends idiom.
# B027 stays out: the AgentBackend no-op hooks are deliberate optional overrides.
# DTZ005 stays out: backup.py's datetime.now() calls are deliberate local time —
#   the backup filename timestamp and the retention age against local-time filenames.
# ERA001 stays out: the flagged comments are prose the parser reads as code —
#   JSON wire-format examples, quoted id shapes, budget formulas, parenthesized
#   cross-references, and dash-line section banners.
# FBT001/FBT002 stay out: bool positional parameters in definitions are the repo's
#   normal shape; only a literal True/False at a call site must name its parameter (FBT003).
# FLY002 stays out: the flagged joins keep their separator visible — the
#   disallowed-tools list's one-group-per-line layout, the delegation request
#   id's NUL-separated key, and the rule sections' newline.
# PLW0108 stays out: the flagged lambdas defer evaluation on purpose (stub seams).
# SIM300 stays out: the flagged comparisons read their subject first — the
#   genre drift guard, the event-type vocabulary equality, and the harness
#   text asserts.
# SLOT000 stays out: two str subclasses carry an extra attribute
#   (_Instructions' overlay_error, PublishResult's path), so
#   __slots__ = () breaks them.
# UP046/UP047 stay out: yapf's pinned lib2to3 parser rejects PEP 695 type-parameter
#   lists, which would make the whole tree unparseable to `yapf -r`
#   (the same constraint src/infra/process.py records on its TypeVar).
select = [
    "E4", "E7", "E9", "F", "I",
    "A001", "A002",
    "B007", "B009", "B905",
    "C408", "C409", "C416", "C420",
    "FBT003",
    "FURB110", "FURB136", "FURB167", "FURB188",
    "ISC004",
    "N818",
    "PERF401",
    "PGH003",
    "PIE807",
    "PLR0402", "PLR1714", "PLR1716",
    "PLW0127",
    "PYI025", "PYI034", "PYI036", "PYI041",
    "RET501", "RET504",
    "RUF005", "RUF007", "RUF023", "RUF043", "RUF059", "RUF100",
    "SIM102", "SIM105", "SIM108", "SIM109", "SIM117",
    "UP012", "UP031", "UP032", "UP035", "UP037",
]

[tool.setuptools]
# The root package mapping makes the editable install a plain-path .pth (the
# finder form preloads pathlib/glob/re into every venv process at site).
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src", "src.*"]

# The data directories hold no Python module, so they are listed beside the package that finds them
# through __file__: the agent PATH shims, the git stash guard, and the node math pre-render driver.
[tool.setuptools.package-data]
"src.runtime" = ["agent_entry_points/*", "git_stash_guard/*"]
"src.features.artifacts" = ["prerender_math.js"]

# The vfork spawn seam's child-side stub (pdeathsig, setsid, stdio dup2,
# close-from-3, execve as pure syscalls) — a compiled module because the
# clone(CLONE_VM|CLONE_VFORK) child may run no Python.
[[tool.setuptools.ext-modules]]
name = "src.runtime.agent_process._vfkspawn"
sources = ["src/runtime/agent_process/_vfkspawn.c"]

# Only uv-managed interpreters: they ship Python.h, so building the extension
# above never depends on the host's python3.x-dev package.
[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 120

# Google Python Style Guide 2.2 import rules via the pylint-google-style dev
# dependency. tools/check-google-style.sh is the only intended runner; the
# disable=all + enable list keeps a plain `uv run pylint <paths>` from
# reporting anything the probe does not count.
[tool.pylint.main]
load-plugins = [
    "pylint_google_style.import_module",
    "pylint_google_style.relative_import",
]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
    "import-symbol-not-module",
    "import-symbol-not-package",
    "relative-import",
    "import-module-unresolvable",
]

# gpu-voice dependencies: the group is not installed by a default `uv sync`,
# so these imports cannot resolve and W9001 would fire on every one of them.
[tool.pylint."import-module"]
import-module-exceptions = ["PIL", "huggingface_hub", "transformers"]
