  description: 'PURPOSE — Eliminate a glaring copy-paste block in core/spawner.py:_build_worker_prompt
    (L36-119) where the continuation branch (L52-65, 14 lines) and non-continuation
    branch (L67-79, 13 lines) of the if/else for is_continuation are byte-identical
