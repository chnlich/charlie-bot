stage: features
name: features-voice-refusals
steps:
  - kind: ws
    name: empty backend id
    path: /ws/voice/${sessions.atlas}
    query: {backend: ""}
    send: []
    until: {frames: 1}
    timeout_seconds: 5
  - kind: ws
    name: removed backend id is unknown
    path: /ws/voice/${sessions.atlas}
    query: {backend: local}
    send: []
    until: {frames: 1}
    timeout_seconds: 5
  - kind: ws
    name: unknown backend id
    path: /ws/voice/${sessions.atlas}
    query: {backend: nope}
    send: []
    until: {frames: 1}
    timeout_seconds: 5
  - kind: ws
    name: Gemini credential is unavailable
    path: /ws/voice/${sessions.atlas}
    query: {backend: gemini}
    send: []
    until: {frames: 1}
    timeout_seconds: 5
  - kind: ws
    name: Muse credential is unavailable
    path: /ws/voice/${sessions.atlas}
    query: {backend: muse}
    send: []
    until: {frames: 1}
    timeout_seconds: 5
