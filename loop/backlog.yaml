    `get_thread_events` (52, per-event-type dispatcher already split into branches),
    `_finalize_worker` (56, sequential status+cleanup pipeline), `_broadcast_completion`
    (53, sequential summary-assembly+broadcast), `trigger_master` (54, sequential
