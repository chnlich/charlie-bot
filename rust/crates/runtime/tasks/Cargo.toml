[package]
name = "charliebot-tasks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only hooks over the end-landing retry and the resume follows (`recovery`). Off by default; only the
# dev-dependency below turns it on, so production builds keep the 30 s retry interval and expose neither set.
test-hooks = []
# The task-execution stack that this crate's integration tests and `charliebot-improve` run against. Off by default;
# only test dev-dependencies turn it on, so a production build compiles none of the fake backends, scripts or
# temporary homes.
test-fixtures = ["dep:serde_yaml", "dep:tempfile", "dep:tower"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
charliebot-agents.workspace = true
charliebot-compat.workspace = true
charliebot-core.workspace = true
charliebot-html.workspace = true
charliebot-registry.workspace = true
charliebot-store.workspace = true
charliebot-usage.workspace = true
futures-util.workspace = true
ignore.workspace = true
libc.workspace = true
nix.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
sha2.workspace = true
tempfile = { workspace = true, optional = true }
time.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
charliebot-anthropic-compatible.workspace = true
charliebot-antigravity.workspace = true
charliebot-charlie-code.workspace = true
charliebot-claude-code.workspace = true
charliebot-codex.workspace = true
charliebot-core = { workspace = true, features = ["test-support"] }
charliebot-gemini.workspace = true
charliebot-shell-harness.workspace = true
charliebot-store = { workspace = true, features = ["write-faults"] }
charliebot-tasks = { path = ".", features = ["test-hooks", "test-fixtures"] }
charliebot-voice.workspace = true
charliebot-web-reply.workspace = true
serde.workspace = true
