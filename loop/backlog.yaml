- id: 096
  title: Introduce SpawnRequest dataclass to reduce spawn_worker parameter count from
    20 to 7
  description: 'PURPOSE — Improve readability and maintainability of the worker spawning
    interface. spawn_worker() (core/spawner.py:533) has 20 parameters, and its internal
    helper _create_worktree_and_process() has 18. All 4 callers (api/internal.py:58,
    core/scheduler.py:270, core/review.py:292, core/improve_command.py:388) pass 10-16
    keyword arguments in long, hard-to-read blocks. This makes the call sites fragile
    — adding a new option requires updating the function signature, all callers, and
    all internal forwarding sites. The 14 optional parameters (repo_path through is_continuation)
    naturally form a "worker configuration" that travels as a unit. HOW — Add a @dataclass
    SpawnRequest to core/models.py (or core/spawner.py) with fields: repo_path (Optional[str]),
    context (Optional[str]), prompt_override (Optional[str]), resolved_backend (str),
    resolved_model (str), base_branch (Optional[str]), branch_name_override (Optional[str]),
    improve_dir (Optional[str]), iteration_number (Optional[int]), require_takeoff
    (bool), worktree_path_override (Optional[str]), skip_cleanup (bool), skip_notify
    (bool), is_continuation (bool) — all with their current defaults. Simplify spawn_worker
    signature to (session_id, description, thread_id, cfg, session_mgr, thread_mgr,
    request: SpawnRequest). Each caller constructs a SpawnRequest with only the fields
    it needs, making the intent clearer. Internally, _create_worktree_and_process
