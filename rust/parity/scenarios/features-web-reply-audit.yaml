# The round-end audit of a web session: a user message that no reply answers wakes one nudge turn, and the nudge turn that
# also answers nothing posts the no-reply notice and marks the session unread. Both scripted manager turns end clean
# with no web reply. The session is the web manager of the web_reply_cases fixture extra.
stage: features
name: features-web-reply-audit
fixture_extras: [web_reply_cases]
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-web-audit-session}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The first web turn ended without a reply.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 10, output_tokens: 4, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-web-audit-session}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The nudged web turn ended without a reply.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 12, output_tokens: 4, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
expect_starts: 2
steps:
  - name: a user message that no reply answers
    method: POST
    path: /api/chat/${sessions.web_reply}/message
    json: {content: "Which layout should the dashboard use?"}
    expect_status: 202
    defer_files: true
  - kind: wait
    name: wait for the audit nudge
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.web_reply}
        type: agent_message
        fields: {from_session_name: "Web reply"}
  - kind: wait
    name: wait for the nudged turn to finish
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.web_reply}
        type: run_finished
        count: 2
  - kind: wait
    name: wait for the no-reply notice
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.web_reply}
        type: web_reply_notice
  - kind: wait
    name: wait for the session to be marked unread
    timeout_seconds: 30
    until:
      file_field:
        path: sessions/${sessions.web_reply}/metadata.json
        field: has_unread
        equals: true
  - name: the dialog lists the user messages and the notice in log order
    method: GET
    path: /api/internal/web/dialog
    query: {session_id: "${sessions.web_reply}"}
    expect_status: 200
  - name: the session status reads as unread after the notice
    method: GET
    path: /api/sessions/status
    query: {ids: "${sessions.web_reply}"}
    expect_status: 200
