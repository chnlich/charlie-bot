[workspace]
resolver = "2"
members = [
    "crates/backends/anthropic_compatible",
    "crates/backends/antigravity",
    "crates/backends/charlie_code",
    "crates/backends/claude_code",
    "crates/backends/codex",
    "crates/backends/gemini",
    "crates/backends/openai_compatible",
    "crates/backends/opencode",
    "crates/runtime/agents",
    "crates/infra/core",
    "crates/infra/compat",
    "crates/infra/cli-common",
    "crates/app/cli",
    "crates/app/packages",
    "crates/app/server",
    "crates/app/structure",
    "crates/runtime/tasks",
    "crates/infra/pyhtml",
    "crates/features/artifacts",
    "crates/features/backup",
    "crates/features/chat_threads",
    "crates/features/cron",
    "crates/features/improve",
    "crates/features/code_server",
    "crates/features/diag",
    "crates/features/disk_sweep",
    "crates/features/diff_view",
    "crates/features/discord",
    "crates/features/explain",
    "crates/features/files",
    "crates/features/host_auth",
    "crates/features/memory",
    "crates/features/ncu",
    "crates/features/slack",
    "crates/features/terminal",
    "crates/features/trace",
    "crates/features/usage",
    "crates/features/voice",
    "crates/features/web_reply",
    "crates/runtime/store",
    "crates/runtime/registry",
    "crates/runtime/session-api",
    "crates/runtime/triggers",
    "crates/runtime/usage",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
backon = "1"
base64 = "0.22"
bstr = "1"
bytes = "1"
caseless = "0.2"
cgfs = "0.1"
# The CLI's argument parser: argparse parity needs the unique long-option prefixes
# (`infer_long_args`) and the usage-error exit code 2, both clap defaults off/own.
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
csv = "1"
data-encoding = "2"
libc = "0.2"
memchr = "2"
memmap2 = "0.9"
mime-db = "1"
# The zlib-rs backend is the request path's deflate: Python's isal level-1 is several times faster than
# miniz_oxide's, and the wire bytes are the same gzip container either way.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lru = "0.19"
html-escape = "0.3"
fancy-regex = "0.16"
form_urlencoded = "1"
jiff = "0.2"
futures-util = "0.3"
getrandom = "0.3"
glob = "0.3"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-proxy"] }
ignore = "0.4"
matchit = "0.9"
md-5 = "0.10"
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
multer = "3.1"
nix = { version = "0.30", features = ["fs", "process", "hostname", "user", "signal", "term", "ioctl"] }
percent-encoding = "2"
proc-macro2 = { version = "1", features = ["span-locations"] }
procfs = { version = "0.18", default-features = false }
regex = "1"
rustix = { version = "1", features = ["process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
shlex = "2"
sha1 = "0.10"
sha2 = "0.10"
shellexpand = { version = "3", default-features = false, features = ["base-0"] }
soft-canonicalize = "0.5"
subtle = "2"
syn = { version = "2", features = ["full", "visit"] }
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time", "process", "sync", "io-util"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
wait-timeout = "0.2"
walkdir = "2"
which = "8"

charliebot-artifacts = { path = "crates/features/artifacts" }
charliebot-agents = { path = "crates/runtime/agents" }
charliebot-anthropic-compatible = { path = "crates/backends/anthropic_compatible" }
charliebot-antigravity = { path = "crates/backends/antigravity" }
charliebot-backup = { path = "crates/features/backup" }
charliebot-chat-threads = { path = "crates/features/chat_threads" }
charliebot-charlie-code = { path = "crates/backends/charlie_code" }
charliebot-claude-code = { path = "crates/backends/claude_code" }
charliebot-cli = { path = "crates/app/cli" }
charliebot-cli-common = { path = "crates/infra/cli-common" }
charliebot-code-server = { path = "crates/features/code_server" }
charliebot-codex = { path = "crates/backends/codex" }
charliebot-cron = { path = "crates/features/cron" }
charliebot-compat = { path = "crates/infra/compat" }
charliebot-core = { path = "crates/infra/core" }
charliebot-diag = { path = "crates/features/diag" }
charliebot-disk-sweep = { path = "crates/features/disk_sweep" }
charliebot-diff-view = { path = "crates/features/diff_view" }
charliebot-discord = { path = "crates/features/discord" }
charliebot-explain = { path = "crates/features/explain" }
charliebot-files = { path = "crates/features/files" }
charliebot-gemini = { path = "crates/backends/gemini" }
charliebot-improve = { path = "crates/features/improve" }
charliebot-host-auth = { path = "crates/features/host_auth" }
charliebot-memory = { path = "crates/features/memory" }
charliebot-ncu = { path = "crates/features/ncu" }
charliebot-openai-compatible = { path = "crates/backends/openai_compatible" }
charliebot-opencode = { path = "crates/backends/opencode" }
charliebot-packages = { path = "crates/app/packages" }
charliebot-pyhtml = { path = "crates/infra/pyhtml" }
charliebot-registry = { path = "crates/runtime/registry" }
charliebot-slack = { path = "crates/features/slack" }
charliebot-store = { path = "crates/runtime/store" }
charliebot-session-api = { path = "crates/runtime/session-api" }
charliebot-triggers = { path = "crates/runtime/triggers" }
charliebot-tasks = { path = "crates/runtime/tasks" }
charliebot-terminal = { path = "crates/features/terminal" }
charliebot-trace = { path = "crates/features/trace" }
charliebot-usage = { path = "crates/runtime/usage" }
charliebot-usage-page = { path = "crates/features/usage" }
charliebot-voice = { path = "crates/features/voice" }
charliebot-web-reply = { path = "crates/features/web_reply" }

# Line tables keep backtrace file and line numbers; full debug info bloats each test binary to ~400 MB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
