stage: agent-orchestration
name: implement-review-chain
fixture_extras: [worker_repo]
config:
  backends:
    pool: [claude-sonnet, claude-opus]
    options:
      - {id: claude-sonnet, label: Synthetic Sonnet, type: cc-claude, model: claude-sonnet-5}
      - {id: claude-opus, label: Synthetic Opus, type: cc-claude, model: claude-opus-5-5}
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-repo-worker}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The repository worker completed without a commit.}]
        - emit: {type: result, result: Repository work is complete., usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-repo-reviewer}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-opus-5-5
              content: [{type: text, text: The reviewed branch is ready to deliver.}]
        - emit: {type: result, result: Review passed., usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-parent-after-repo}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The repository delivery report is recorded.}]
        - emit: {type: result, result: "", usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-repoless-worker}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The repo-less worker completed its paths.}]
        - emit: {type: result, result: Repo-less work is complete., usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-repoless-reviewer}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-opus-5-5
              content: [{type: text, text: The repo-less paths pass review.}]
        - emit: {type: result, result: Review passed., usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-parent-after-repoless}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The repo-less delivery report is recorded.}]
        - emit: {type: result, result: "", usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-failed-worker}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The worker completed and needs review.}]
        - emit: {type: result, result: Work is complete., usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-failed-reviewer}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-opus-5-5
              content: [{type: text, text: The reviewer found a synthetic failure.}]
      exit_code: 1
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-parent-after-blocked}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The blocked delivery report is recorded.}]
        - emit: {type: result, result: "", usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-exhausted-reviewer}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-opus-5-5
              content: [{type: text, text: The reviewer exhausted its attempt.}]
      exit_code: 1
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-review-parent-after-blocked-report}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The blocked review report was received.}]
        - emit: {type: result, result: "", usage: {input_tokens: 3, output_tokens: 2}}
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-status-reminder-review}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: Status reviewed after the blocked review report.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
expect_starts: 12
steps:
  - name: delegate a repo task whose unchanged branch already landed on origin main
    method: POST
    path: /api/internal/delegate
    json:
      session_id: ${sessions.atlas}
      description: Review the synthetic repository task and deliver it.
      task_type: implement
      repo_path: ${tree.root}/${extras.worker_repo.repo}
      base_branch: main
      backend: claude-sonnet
      request_id: synthetic-delegate-implement-failure
    capture: {repo_child: session_id, session_id: session_id, repo_work: run_id}
    expect_status: 200
  - kind: wait
    name: repository work succeeds
    timeout_seconds: 30
    until:
      event:
        session: ${capture.repo_child}
        type: run_finished
        fields: {run_id: "${capture.repo_work}", outcome: success}
  - kind: wait
    name: repository review completes and task delivery closes it
    timeout_seconds: 30
    until:
      event:
        session: ${capture.repo_child}
        type: task_closed
        fields: {outcome: completed}
  - kind: wait
    name: parent receives the repository completion report
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.atlas}
        type: child_report
        fields: {child_session_id: "${capture.repo_child}", outcome: completed}
  - name: read the repo review run
    method: GET
    path: /api/sessions/${capture.session_id}/runs
    query: {order: desc, limit: 100}
    capture: {repo_review: items.0.id, repo_worktree: items.0.worktree_path}
    expect_status: 200
  - kind: wait
    name: repository review uses the other pool member
    timeout_seconds: 10
    until:
      file_field:
        path: sessions/${capture.repo_child}/data/runs/${capture.repo_review}/metadata.json
        field: backend
        equals: claude-opus
  - kind: wait
    name: delivered repository worktree is removed
    timeout_seconds: 10
    until:
      tree_path_missing:
        path: ${capture.repo_worktree}
  - name: delegate a repo-less implement task
    method: POST
    path: /api/internal/delegate
    json:
      session_id: ${sessions.atlas}
      description: Review the synthetic repo-less output paths.
      task_type: implement
      backend: claude-sonnet
      request_id: synthetic-review-repoless
    capture: {repoless_child: session_id, repoless_work: run_id}
    expect_status: 200
  - kind: wait
    name: repo-less work succeeds
    timeout_seconds: 30
    until:
      event:
        session: ${capture.repoless_child}
        type: run_finished
        fields: {run_id: "${capture.repoless_work}", outcome: success}
  - kind: wait
    name: repo-less review closes the task without landing
    timeout_seconds: 30
    until:
      event:
        session: ${capture.repoless_child}
        type: task_closed
        fields: {outcome: completed}
  - kind: wait
    name: parent receives the repo-less completion report
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.atlas}
        type: child_report
        fields: {child_session_id: "${capture.repoless_child}", outcome: completed}
  - name: delegate a task whose reviewer exhausts the configured pool
    method: POST
    path: /api/internal/delegate
    json:
      session_id: ${sessions.atlas_survey}
      description: Review the synthetic task and report the exhausted reviewer pool.
      task_type: implement
      repo_path: ${tree.root}/${extras.worker_repo.repo}
      base_branch: main
      backend: claude-sonnet
      request_id: synthetic-delegate-implement-failure
    capture: {failed_child: session_id, failed_work: run_id}
    expect_status: 200
  - kind: wait
    name: failed-review task reports blocked to its parent
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.atlas_survey}
        type: child_report
        fields:
          child_session_id: "${capture.failed_child}"
          outcome: blocked
          summary: "review of work run ${capture.failed_work} failed on every configured reviewer backend; backends.pool: claude-sonnet not cooling; claude-opus not cooling"
  - kind: wait
    name: failed-review task is archived after its blocked report
    timeout_seconds: 30
    until:
      event:
        session: ${capture.failed_child}
        type: task_closed
        fields: {outcome: archived}
