    only the already-tracked `WatchTarget` unused import in `api/internal.py` (covered
    by pending items #131 and #139). `vulture src/ --min-confidence 80` reports only
    the `cls` classmethod parameter in `core/config.py:127`, which is a Pydantic-validator
    requirement and a known vulture false positive. The >50-line function scan was
    fully enumerated by items #154 and #155 on this same branch and is not re-litigated
    here (every long-function candidate is either covered by a pending refactor item
    — #107/108/109/116/125/126/127/129/132/134/135/136/137/140/141/142/144/153/154
    — or explicitly rejected as a coherent single-flow function in #154''s description,
    and the `except Exception: pass` survey was settled by #155). pylint''s `unused-argument`
    pass also flags `_create_repoless_process` (session_mgr at `core/spawner.py:370`),
    `_execute_handler_task` (unpacked `cfg` local at `core/scheduler.py:183`), `list_scheduled_sessions`
    (`cfg = Depends(get_config)` at `api/sessions.py:158`), and a handful of FastAPI/CLI
