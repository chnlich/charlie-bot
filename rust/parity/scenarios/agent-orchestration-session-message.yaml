stage: agent-orchestration
name: agent-orchestration-session-message
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-relay-target}
        - gate: relay-target-turn
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The relayed message was received.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-status-reminder-sm-1}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: Status reviewed at the end of the scenario.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-child-user-message}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The child manager answered the user message.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-status-reminder-sm-2}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: Status reviewed after the child's user message.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
expect_starts: 4
comparison_rules:
  # The status reminder and the run_finished of the audited turn, in either order: that turn's after_turn runs as its
  # own task (src/runtime/session_events.py:156-161), and its finish callback writes run_finished after the master_done
  # broadcast (src/runtime/master_cc_queue.py:304-309), as features-web-reply-audit compares them.
  - either_order_of_adjacent_events:
      first:
        type: agent_message
        match_fields: {from_session_name: "Session status"}
      second:
        type: run_finished
        match_fields: {outcome: success}
  # The no-reply notice and the run_finished of the turn it audits can also land in either order; its own event names
  # the user message it answers, which the message step captures on each side.
  - either_order_of_adjacent_events:
      first:
        type: web_reply_notice
        match_fields: {web_reply_notice: {input_event_id: "${capture.child_input}"}}
      second:
        type: run_finished
        match_fields: {outcome: success}
steps:
  - name: a relay over the weighted limit is refused before any lookup
    method: POST
    path: /api/internal/session-message
    body_file: session-message-over-limit.json
    expect_status: 422
  - name: an ASCII relay over the weighted limit is refused before any lookup
    method: POST
    path: /api/internal/session-message
    body_file: session-message-over-limit-ascii.json
    expect_status: 422
  - name: extra relay fields keep the FastAPI validation shape
    method: POST
    path: /api/internal/session-message
    json:
      session_id: ${sessions.atlas}
      target_session_id: ${sessions.atlas_survey}
      content: Extra field.
      surprise: refused
    expect_status: 422
    compare: status_and_shape
  - name: a relay from an unknown session returns not found
    method: POST
    path: /api/internal/session-message
    json:
      session_id: ${missing_session}
      target_session_id: ${sessions.atlas_survey}
      content: Unknown caller.
    expect_status: 404
  - name: a relay to an unknown session returns not found
    method: POST
    path: /api/internal/session-message
    json:
      session_id: ${sessions.atlas}
      target_session_id: ${missing_session}
      content: Unknown target.
    expect_status: 404
  - name: a relay to an archived root is refused
    method: POST
    path: /api/internal/session-message
    json:
      session_id: ${sessions.atlas}
      target_session_id: ${sessions.beacon}
      content: Archived target.
    expect_status: 409
  - name: a relay to a live session is accepted
    method: POST
    path: /api/internal/session-message
    json:
      session_id: ${sessions.atlas}
      target_session_id: ${sessions.atlas_survey}
      content: Synthetic relay message.
    expect_status: 200
  - kind: wait
    name: the target manager is at the relay gate
    timeout_seconds: 30
    until: {at_gate: relay-target-turn}
  - kind: gate
    name: let the target manager answer the relay
    open: relay-target-turn
  - kind: wait
    name: the relayed message is admitted into the target
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.atlas_survey}
        type: agent_message
        fields: {from_session_name: Atlas planning, content: Synthetic relay message.}
  - name: send a user message to the child manager
    method: POST
    path: /api/chat/${sessions.atlas_survey}/message
    json: {content: A synthetic user message to the child., request_id: synthetic-sidebar-child-message}
    capture: {child_input: input_event_id}
    expect_status: 202
    defer_files: true
  - kind: wait
    name: wait for the child manager and its reminders to settle
    timeout_seconds: 30
    until:
      event: {session: "${sessions.atlas_survey}", type: run_finished, fields: {outcome: success}, count: 5}
  - name: the messaged child lists ahead of its root
    method: GET
    path: /api/sessions/
    expect_status: 200
