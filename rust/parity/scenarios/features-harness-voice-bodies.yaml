stage: features
name: features-harness-voice-bodies
steps:
  - name: invalid raw audio file body is rejected
    method: POST
    path: /api/voice/${missing_session}/confirm
    body_file: audio/not-wave.bin
    expect_status: 400
  - name: invalid multipart upload is rejected
    method: POST
    path: /api/voice/${missing_session}
    multipart:
      audio: {file: audio/not-wave.bin, content_type: audio/wav}
      backend: gemini
    expect_status: 400
