stage: features
name: features-usage-page
fixture_extras: [usage_ledger_rows]
steps:
  - name: token-usage page over the seeded ledger
    method: GET
    path: /token-usage
    expect_status: 200
  - name: token-usage page, head is not allowed
    method: HEAD
    path: /token-usage
    expect_status: 405
  - name: token-usage page, post is not allowed
    method: POST
    path: /token-usage
    expect_status: 405
