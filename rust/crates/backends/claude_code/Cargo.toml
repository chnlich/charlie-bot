[package]
name = "charliebot-claude-code"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The test support that this crate's tests share with the Anthropic-compatible entry's tests. Off by default; only the
# dev-dependencies turn it on, so a production build compiles none of it.
test-support = []

[dependencies]
anyhow.workspace = true
backon.workspace = true
charliebot-agents.workspace = true
charliebot-compat.workspace = true
charliebot-core.workspace = true
charliebot-registry.workspace = true
charliebot-store.workspace = true
futures-util.workspace = true
glob.workspace = true
memchr.workspace = true
nix.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
shellexpand.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
walkdir.workspace = true
reqwest = { workspace = true, features = ["json", "query", "stream"] }

[dev-dependencies]
charliebot-claude-code = { path = ".", features = ["test-support"] }
charliebot-shell-harness.workspace = true
