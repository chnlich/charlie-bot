stage: features
name: features-artifact-view
fixture_extras: [artifacts_view_pages]
steps:
  - name: get a session artifact page with the comment UI
    method: GET
    path: /absolute_filepath${tree.home}/sessions/${sessions.artifacts_view}/artifacts/plan_01_v2.html
    expect_status: 200
  - name: compare a session artifact with its earlier version
    method: GET
    path: /absolute_filepath${tree.home}/sessions/${sessions.artifacts_view}/artifacts/plan_01_v2.html
    query: {diff: "artifacts/plan_01_v1.html"}
    expect_status: 200
  - name: reject a base outside the session artifacts directory
    method: GET
    path: /absolute_filepath${tree.home}/sessions/${sessions.artifacts_view}/artifacts/plan_01_v2.html
    query: {diff: "notes/plan_01.html"}
    expect_status: 400
  - name: return 404 for a missing base page
    method: GET
    path: /absolute_filepath${tree.home}/sessions/${sessions.artifacts_view}/artifacts/plan_01_v2.html
    query: {diff: "artifacts/missing.html"}
    expect_status: 404
  - name: reject a directory diff target
    method: GET
    path: /absolute_filepath${tree.home}/sessions/${sessions.artifacts_view}/artifacts/directory
    query: {diff: "artifacts/plan_01_v1.html"}
    expect_status: 400
  - name: pass a missing diff target to the file server
    method: GET
    path: /absolute_filepath${tree.home}/sessions/${sessions.artifacts_view}/artifacts/missing.html
    query: {diff: "artifacts/plan_01_v1.html"}
    expect_status: 404
  - name: serve an artifact-shaped page outside any session unchanged
    method: GET
    path: /absolute_filepath${tree.root}/workspace/artifacts/outside.html
    expect_status: 200
  - name: serve a non-HTML file in an artifacts directory unchanged
    method: GET
    path: /absolute_filepath${tree.home}/sessions/${sessions.artifacts_view}/artifacts/trace.bin
    expect_status: 200
