# readme: >-
#   Secrets for this charliebot profile, kept apart from config.yaml (which holds
#   structure only). Copy the file to your charliebot home as credentials.yaml,
#   uncomment what you need, and keep the file mode at 0600. The shape is
#   section -> key -> scalar, one key per line; the server validates shape only,
#   never section or key names. The server itself reads charliebot.access_key,
#   slack.bot_token, slack.app_token, telegram.bot_token, and <section>.api_key
#   for backend entries carrying credential: <section>; skills read their own
#   sections.
# charliebot:
#   access_key:
# slack:
#   bot_token:
#   app_token:
#   user_token:
# telegram:
#   bot_token:
# moonshot:
#   api_key:
# gemini:
#   api_key:
#   model:
# aigw:
#   api_key:
# feishu:
#   app_id:
#   app_secret:
#   refresh_token:
#   user_access_token:
# google:
#   client_id:
#   client_secret:
#   refresh_token:
#   docs_default_folder_id:
# linear:
#   api_key:
# twitter:
#   api_key:
#   api_secret:
#   access_token:
#   access_token_secret:
