    `try: await _finalize_worker(session_id, description, thread, exit_code, thread_mgr,
    session_mgr, cfg, quota_exhausted=..., error=error_msg, skip_notify=req.skip_notify)`;
    L608-609 `except Exception as e: log.error("spawn_worker_finalize_failed", session=session_id,
    traceback=traceback.format_exc())`; L610-615 `try: await session_mgr.persist_and_broadcast(session_id,
    {"type": ET.ERROR, "content": f"Worker finalization failed: {e}"})`; L616-617
    `except Exception: log.warning("spawn_worker_finalize_broadcast_failed", session=session_id,
    exc_info=True)`.

    HOW — Add `async def _finalize_worker_safely(session_id: str, description: str,
    thread: ThreadMetadata, exit_code: int, thread_mgr: ThreadManager, session_mgr:
    SessionManager, cfg: CharlieBotConfig, quota_exhausted: bool, error: str, skip_notify:
    bool) -> None` as a private module-level coroutine in src/core/spawner.py, placed
