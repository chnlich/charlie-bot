stage: features
name: features-slack-reply-failure
config:
  slack:
    allowed_user_ids: [U0PARITY]
credentials:
  slack:
    bot_token: xoxb-parity-synthetic-token
    app_token: xapp-parity-synthetic-token
fakes:
  slack:
    failures:
      /api/chat.postMessage: 502
steps:
  - name: map a Slack chat.postMessage failure to 502
    method: POST
    path: /api/internal/slack/reply
    json:
      session_id: ${sessions.delta}
      text: Slack will reject this reply.
    expect_status: 502
