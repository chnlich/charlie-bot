# The session write routes against a live manager run's token: a create outside the run's own task, a create under it,
# and a task-field PATCH, all refused or answered by the caller's identity. The manager turn holds at a gate while the
# steps run, so the run is launched and unfinished when each agent token is checked.
stage: session-write
name: session-write-agent
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-agent-caller}
        - gate: agent-caller-turn
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic agent caller turn finished.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 2, output_tokens: 1, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
expect_starts: 1
steps:
  - name: send the gated manager message
    method: POST
    path: /api/chat/${sessions.delta}/message
    json: {content: Hold the synthetic turn for the agent caller., request_id: synthetic-chat-session-write-agent}
    capture: {message_input: input_event_id}
    expect_status: 202
    defer_files: true
  - kind: wait
    name: wait at the agent caller gate
    timeout_seconds: 30
    until: {at_gate: agent-caller-turn}
  - name: the gated run, newest first
    method: GET
    path: /api/sessions/${sessions.delta}/runs
    query: {order: desc, limit: 100}
    capture: {run: items.0.id}
    expect_status: 200
    defer_files: true
  - name: create outside the run's own task
    method: POST
    path: /api/sessions/
    auth: agent
    agent: {session: "${sessions.delta}", run: "${capture.run}"}
    json: {request_id: agent-outside-scope, task_parent_id: "${sessions.atlas_survey}", profile: worker, name: Agent outside scope}
    expect_status: 403
    defer_files: true
  - name: create under the run's own manager task
    method: POST
    path: /api/sessions/
    auth: agent
    agent: {session: "${sessions.delta}", run: "${capture.run}"}
    json:
      request_id: agent-own-child
      task_parent_id: "${sessions.delta}"
      profile: worker
      name: Agent child
      task: {goal: Check the synthetic release notes., task_type: verify}
    expect_status: 200
    defer_files: true
  - name: task metadata mutation by the agent
    method: PATCH
    path: /api/sessions/${sessions.delta}
    auth: agent
    agent: {session: "${sessions.delta}", run: "${capture.run}"}
    json: {profile: worker}
    expect_status: 403
    defer_files: true
  - kind: gate
    name: release the agent caller turn
    open: agent-caller-turn
  - kind: wait
    name: wait for the agent caller turn to finish
    timeout_seconds: 30
    until:
      event:
        session: ${sessions.delta}
        type: run_finished
        fields: {input_event_ids: ["${capture.message_input}"]}
