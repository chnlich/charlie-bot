stage: features
name: features-files
fixture_extras: [files_tree]
steps:
  - name: get text file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.txt}
    expect_status: 200
  - name: head text file
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.txt}
    expect_status: 200
  - name: get html file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.html}
    expect_status: 200
  - name: head html file
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.html}
    expect_status: 200
  - name: get json file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.json}
    expect_status: 200
  - name: head json file
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.json}
    expect_status: 200
  - name: get png file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.png}
    expect_status: 200
  - name: head png file
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.png}
    expect_status: 200
  - name: get bin file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.bin}
    expect_status: 200
  - name: head bin file
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.bin}
    expect_status: 200
  - name: get file without extension
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.no_extension}
    expect_status: 200
  - name: head file without extension
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.no_extension}
    expect_status: 200
  - name: get empty file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.empty}
    expect_status: 200
  - name: head empty file
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.empty}
    expect_status: 200
  - name: get file with a space in its name
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.spaced}
    expect_status: 200
  - name: head file with a space in its name
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.spaced}
    expect_status: 200
  - name: get file with a non-ASCII name
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.unicode}
    expect_status: 200
  - name: head file with a non-ASCII name
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.unicode}
    expect_status: 200
  - name: get file in a nested directory
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.nested_file}
    expect_status: 200
  - name: head file in a nested directory
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.nested_file}
    expect_status: 200
  - name: get listing of the files directory
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.files_dir}
    expect_status: 200
  - name: head listing of the files directory
    method: HEAD
    path: /absolute_filepath${tree.root}/${extras.files_tree.files_dir}
    expect_status: 200
  - name: get listing of the nested directory
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.nested_dir}
    expect_status: 200
  - name: get listing of the nested directory with a trailing slash
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.nested_dir}/
    expect_status: 200
  - name: get file through a symbolic link to a file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.link_file}
    expect_status: 200
  - name: get listing through a symbolic link to a directory
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.link_dir}
    expect_status: 200
  - name: get file through a path with dot-dot segments inside the tree
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.nested_dir}/../notes.txt
    expect_status: 200
  - name: get missing file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.files_dir}/missing.txt
    expect_status: 404
  - name: get missing file under an existing file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.txt}/missing.txt
    expect_status: 404
  - name: get a range of the bin file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.bin}
    headers: {range: "bytes=0-15"}
    expect_status: 206
  - name: get a range past the end of the bin file
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.bin}
    headers: {range: "bytes=5000-"}
    expect_status: 416
  - name: get text file with a conditional header a static file would answer 304
    method: GET
    path: /absolute_filepath${tree.root}/${extras.files_tree.txt}
    headers: {if-modified-since: "Wed, 01 Jan 2031 00:00:00 GMT"}
    expect_status: 200
  - name: get bare mount prefix
    method: GET
    path: /absolute_filepath
    headers: {host: parity.invalid}
    expect_status: 307
  - name: get the unmounted files prefix
    method: GET
    path: /files/x
    expect_status: 404
  - name: get the unmounted file prefix
    method: GET
    path: /file/x
    expect_status: 404
