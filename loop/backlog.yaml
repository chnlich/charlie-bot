- id: 088
  title: Consolidate build_session_view_data and build_session_view_data_fast into
    single function
  description: 'PURPOSE — Eliminate 25 lines of duplicated session-view loading pipeline
    between build_session_view_data() and build_session_view_data_fast() in api/message_utils.py,
    reducing the risk of divergence when the load-events, events_to_messages, resolve_usage,
    or mark_read steps change. Both functions (L109-127 and L140-171) follow the same
    5-step pipeline: (1) launch parallel tasks for events, threads, and session metadata
    via asyncio.gather, (2) validate session_meta is not None, (3) convert events
    to messages via events_to_messages, (4) resolve usage via session_mgr.resolve_session_usage,
