# CharlieBot config template — structure only. Secrets live in credentials.yaml
# (seeded alongside this file from configs/credentials.example.yaml); never put a
# secret key or value here.
# setup.sh copies this file to $CHARLIEBOT_HOME/config.yaml when that file does not
# exist, and the server startup path (init_charliebot_home) seeds it too if still
# missing. Every uncommented field below sits at its schema default, except the
# backend list. That list's schema default is empty, and an empty list fails
# server startup (require_backends), so the example carries a working list.
# Edit per host, and never commit your filled-in config.yaml.
#
# Unknown keys fail startup — at the top level and inside every section.
# Keys from the old flat layout fail startup too: the error names each retired
# key and the section key it moved to (e.g. server_port -> server.port).
# Config fragments: only $CHARLIEBOT_HOME/config.d/cron.d/ holds fragment files
# (one cron job per file); any other yaml under config.d/ fails startup.
# `charliebot config get <key>` prints a key's value wherever it lives.

# Server: the bind address the server listens on.
server:
  host: 127.0.0.1
  port: 18498
  subprocess_buffer_limit_mb: 1024
  # Per-session memory-cap cgroup, MB: every agent process a session spawns is held
  # to this hard limit; 0 disables cgroup control entirely. session_swap_max_mb
  # bounds swap use separately (0 = no swap).
  session_memory_max_mb: 12288
  session_swap_max_mb: 0
  # Per-session task cap (processes plus threads), written to the session cgroup's
  # pids.max: a runaway fork loop fails inside its own session instead of
  # exhausting the host's PID space. 0 means no task cap.
  session_tasks_max: 4096
  # Session cpu and io shares: each session cgroup gets weight 100, so the agents
  # split the CPU and the root disk evenly. false stops that controller and its
  # weight writes. The cpu weight is on by default. The io weight is off by
  # default: io reaches the agents slice only after setup-io-share.sh has
  # delegated io there, and a host sets it true once io appears in the agents
  # slice's cgroup.controllers (scripts/systemd/setup-io-share.sh).
  enable_session_cpu_weight: true
  enable_session_io_weight: false
  # Local work guard: an agent's shell refuses a compile or a test run on this host and names the build host that
  # remote_run.host sets, so one run does not slow the other agents. false sets none of its variables.
  enable_local_work_guard: true
  # Worker-class launch precheck, GiB: the filesystems holding the CharlieBot
  # data dir and the worktree root must hold at least this much free space, or
  # the run stays queued with a blocked report to its parent. 0 disables the
  # check. Manager turns never check (they write little and are the path that
  # reports the shortage).
  min_free_disk_gib: 10
  # The address a person reaches this server at, read by `charliebot config get server.public_url`. It has no
  # default: a command that links a page on this server fails until the host sets it.
  # public_url: https://<host>.<tailnet>:18498

# Remote run: the build host that dev/remote-run sends runs to, and the local work guard's refusal names. A top-level
# section, not server keys, so a host sets it while the previous release still runs. Each run reads these keys, so an
# edit applies to the next run without a restart. Until the host is set, the runner stops with exit 2 and names it.
remote_run:
  host:
  # The runner's state directory on the build host, relative to its home.
  # remote_base: scripts/remote-run

# Paths: repos to scan and where worker worktrees live.
paths:
  workspace_dirs:
    - ~/workspace
  worktree_dir: ~/worktrees

# Backends: the model-switch options, the named pools of members, and the call classes that name them.
backends:
  # Pools: each entry has an id, label, rule and members, and no other key beside the optional `visible` flag.
  # Ids are unique across the options ids, the pool ids and the word `session`. One option may be a member of
  # several pools: its out record belongs to the option, so a member that runs out is skipped by every pool that
  # names it. Empty = no pool. visible: false (optional, default true) keeps the pool out of the web pickers; a
  # session it runs stays shown on it, and it still serves as a calls target and switch target.
  #
  # rule: rotate. Members are option ids in order, and a repeated id takes a larger share of calls. Each call takes
  # the first selectable member after the pool's rotation position, which then moves past the member it took. The
  # position lives in server memory, so a restart starts each rotation again at its first member.
  #
  # rule: priority. Members are option ids too, and no member repeats; each member's option names its billing
  # (subscription or payg). Each call takes the best selectable member:
  #   1. Subscriptions first. A subscription is near exhaustion when its usage is at or above 90% and its earliest
  #      reset is more than 45 minutes away. The selectable subscriptions below that line form the tier; when none
  #      is below it, all selectable subscriptions form the tier.
  #   2. In the tier, the member that the fewest active sessions of this pool hold is taken; config order breaks ties.
  #   3. Pay-as-you-go members only when no subscription is selectable: the first selectable one in config order.
  #
  # A member is selectable unless the call excludes it, it is out, or its usage reading says it has no capacity
  # left. A member whose quota runs out is out until its reset (30 minutes when the error gives none), and the
  # session or call moves on to the next selectable member. With none left, the turn or call fails with a list of
  # every member and its state.
  pools: []
  #  - id: primary
  #    label: Primary
  #    rule: priority
  #    members: [claude-opus, claude-sonnet, claude-fable]
  #  - id: light
  #    label: Light
  #    rule: rotate
  #    members: [claude-sonnet, claude-opus]
  # Calls: each key names an option id, a pool id, or `session`. A key left out keeps the call's default, given
  # below. [session] marks the keys that accept `session`, the backend of the session that starts the call; for those,
  # a left-out key behaves the same as `session`. A backend that a request names, or a router answer
  # (backends.routing), takes the call before the key does.
  #   worker       implement, quick-edit and script-run tasks; left out: the starting session's backend [session]
  #   improve      the improve loop's runs; left out: the starting session's backend [session]
  #   verify       verify tasks, which check a finished result; left out: the worker's own backend [session]
  #   review       the reviewer that follows a successful work run; left out: the worker's own backend [session]
  #   cold_read    cold-read tasks, a fresh reader's pass over a page; left out: the worker's own backend [session]
  #   probe        the one-shot probe of the artifact check and web-reply commands; left out: the command fails
  #   autoname     a session's title and group; left out: sessions keep their default names
  #   triage       failure triage's judgement of each failure signature; left out: the triage scan will not start
  #   thread       a chat thread's backend when the router does not route it; left out: the new_session
  #                target, else the first backends.options entry
  #   new_session  the backend a session or scheduled task takes when its request names none; left out: the first
  #                backends.options entry
  # calls:
  #   worker: primary
  #   review: light
  #   thread: light
  #   new_session: claude-opus
  # Backends available for model switching. Editing the list REPLACES it — to
  # add a codex backend, append an entry such as:
  #   - id: codex-luna
  #     label: Codex · GPT-6 Luna
  #     type: codex
  #     model: gpt-6-luna
  # Codex reasoning effort is xhigh unless the entry sets model_reasoning_effort.
  # A devin entry runs the Devin CLI headless with every tool approved. Its model is the SWE-2 id
  # that `devin models list` prints after `devin auth login`; the id must start with `devin-`.
  #   - id: devin-swe2
  #     label: "Devin · SWE-2"
  #     type: devin
  #     model: <id from devin models list>
  # billing: subscription | payg (optional) says how the entry's account is paid for; a priority pool's
  # member needs it, and every pool that names the entry reads it here.
  # visible: false (optional, default true) keeps the entry out of the web pickers. Its label still renders
  # wherever a session row or pool member shows it, and it still serves as a pool member, a calls target and a
  # switch target.
  # An id names the model family, never a version: a version bump edits only the
  # entry's model and label (the id rule: usage's startup check in rust/crates/features/usage/src/backend_ids.rs
  # refuses an id outside the prefixes the backend types register).
  # Router program that routes unpinned work (commented out: without this section each call class
  # runs on its configured target). The first item resolves on the server process's
  # PATH; each request starts it once, feeds it one JSON object on stdin ({role, text,
  # session_backend, candidates: [{id, cooling_until}]}; session_backend is null for a thread) and
  # reads one JSON object on stdout ({routed: true|false, backends: [id, ...], reason: "one line"}).
  # The server side is route_command in rust/crates/runtime/agents/src/backend_pool.rs; the charliebot
  # router CLI it names is the Rust subcommand in rust/crates/app/cli/src/commands/router.rs, which
  # reads <charliebot home>/router.yaml (configs/router.example.yaml shows its form).
  # routing:
  #   command: [charliebot, router]
  options:
    - id: claude-fable
      label: "CC · Fable 5.1"
      type: cc-claude
      model: claude-fable-5-1
      billing: subscription
      effort: xhigh
    - id: claude-opus
      label: "CC · Opus 5"
      type: cc-claude
      model: claude-opus-5
      billing: subscription
      effort: xhigh
    - id: claude-sonnet
      label: "CC · Sonnet 5"
      type: cc-claude
      model: claude-sonnet-5
      billing: subscription
      effort: xhigh

# Accounts: the Claude subscription pool and its compaction floors.
accounts:
  claude: []
  # Named account pools: each key maps a pool name to the account labels (from `claude` above) it holds.
  claude_pools: {}
  claude_compaction:
    relay_tokens: 100000
    expired_cache_tokens: 50000

# Claude Code: the backend package's own switches.
claude_code:
  # Claude Code's own subagents (the Agent tool): true removes Agent from the disallowed tools of manager
  # turns, work runs and improve iterations. false keeps Agent disallowed on every run kind.
  enable_subagents: false

# Voice: online transcription backend selection.
voice:
  # Transcription backend used before a choice is made in the page's dropdown,
  # and by the upload when a request names none: one of the transcription
  # registry's ids (gemini, muse). The backends need credentials.yaml keys
  # (gemini.api_key, meta.model_api_key).
  default_backend: gemini
  # Proper-noun vocabulary passed to the backends that support it (Gemini,
  # Muse).
  vocabulary: []
  # Language hints as BCP-47 base codes (zh, en); empty = auto-detect.
  languages: []

# Code server: code-server integration.
code_server:
  bin:
  config: configs/code-server.yaml

# Plan page-height gate: absolute path of a headless-chromium-compatible binary.
headless_chrome_bin: ""

# UI: the /home page service cards.
ui:
  home_services: []

# Slack: the summon entrypoint's user allow-list.
slack:
  allowed_user_ids: []

# GitHub: two token commands, each a command line run without a shell, so a host
# sets its own commands here and no repository file names a host path.
# user_token_command prints the operator's own GitHub token, which the draft
# sender uses for a pull request or comment in the operator's name; unset, a
# GitHub draft cannot be sent. app_token_command is the agent gh wrapper's App
# token command: the executable (one path, `~` expanded) the wrapper runs with
# `--write <owner>/<repo>` to mint the agent GitHub App's installation token for
# a text-carrying write; absent, the wrapper refuses every text-carrying write
# and names this key in the error. The server reads the key from the live
# config when it spawns each agent process, so a key added, changed or removed
# here reaches the next agent spawn without a server restart.
github:
  user_token_command:
  app_token_command:

# Discord: the summon entrypoint's account map (Discord user id -> the person
# that account belongs to).
discord:
  allowed_users: {}

# Feishu: the owner map (Feishu open_id -> the person that account belongs to). A
# group is admitted when one of these people is a member of it, and then every
# human member of that group can summon the bot. The app id and secret live in
# credentials.yaml under feishu.
feishu:
  allowed_users: {}

# Publish: the outbound publish lane. Set command (an external program's argv) or
# the directory pair dir + public_base_url, never both: dir is what the static lane
# serves, and public_base_url is the base of the links readers outside the
# operator's devices open.
publish:
  command:
  dir:
  public_base_url:

# Telegram: the notification target.
telegram:
  chat_id:

