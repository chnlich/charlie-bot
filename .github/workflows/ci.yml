name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'code-health/')
    env:
      BODY: ${{ github.event.pull_request.body }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce contract
        run: |
          diff_lines="${DIFF_LINES:-$(git diff origin/main...HEAD --numstat | awk '{a+=$1; d+=$2} END {print a+d}')}"
          echo "$BODY" | grep -q '## Evidence' || { echo "PR body missing '## Evidence' section"; exit 1; }
          if [ "$diff_lines" -gt 300 ]; then
            echo "$LABELS" | grep -q 'split-series' || { echo "diff exceeds 300 lines and missing 'split-series' label"; exit 1; }
          fi
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The formatter config and pin were deleted twice as "unused" (#394, #396) because
      # nothing inside the repo invokes yapf — the caller is the code-health cron on the
      # host (~/.charliebot/config.d/cron.d/code-health.yaml), which a whole-repo grep
      # cannot see. Without .style.yapf, `yapf --in-place --recursive src/` silently falls
      # back to pep8 defaults and reformats the tree to 4-space indent.
      - name: Formatter config present
        run: |
          test -f .style.yapf || {
            echo "::error file=.style.yapf::.style.yapf is missing — the code-health cron runs"
            echo "yapf against src/ and without this file it reformats the tree to 4-space indent."
            exit 1
          }
          grep -q '"yapf' pyproject.toml || {
            echo "::error file=pyproject.toml::the yapf pin is missing from [project.dependencies]"
            exit 1
          }
          grep -q '^indent_width = 2$' .style.yapf || {
            echo "::error file=.style.yapf::indent_width must stay 2 (Google style, per project.md 10.1)"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src

      - name: Test
        run: uv run pytest -q -m "not local_only"
