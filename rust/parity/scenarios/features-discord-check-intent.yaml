stage: features
name: features-discord-check-intent
description: The check route reads the message-content intent as off when the application flags lack it.
config:
  discord:
    allowed_users:
      "900000000000000099": Synthetic user
credentials:
  discord:
    bot_token: discord-parity-synthetic-token
fakes:
  discord:
    application_flags: 0
steps:
  - name: check reports the intent off
    method: POST
    path: /api/internal/discord/check
    json: {}
    expect_status: 200
