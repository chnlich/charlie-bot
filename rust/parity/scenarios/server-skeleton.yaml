# The server skeleton: the public routes, the access-key gate, the page entry and the static files.
stage: server-skeleton
name: skeleton
config:
  ui:
    home_services:
      - name: Synthetic local service
        description: Checks a local closed port.
        url: http://127.0.0.1:9/
steps:
  - name: auth status, no key (public route)
    method: GET
    path: /api/auth/status
    auth: none
    expect_status: 200
  - name: auth status, bearer key
    method: GET
    path: /api/auth/status
    expect_status: 200
  - name: version, bearer key
    method: GET
    path: /api/internal/version
    expect_status: 200
  - name: version, no key (JSON 401)
    method: GET
    path: /api/internal/version
    auth: none
    expect_status: 401
  - name: version, wrong bearer key (JSON 401)
    method: GET
    path: /api/internal/version
    auth: none
    headers:
      Authorization: Bearer not-the-access-key
    expect_status: 401
  - name: version, access-key cookie
    method: GET
    path: /api/internal/version
    auth: cookie
    expect_status: 200
  - name: page root, bearer key (redirect to the first session)
    method: GET
    path: /
    expect_status: 307
  - name: page root, no key (public route)
    method: GET
    path: /
    auth: none
    expect_status: 307
  - name: page with a session, bearer key
    method: GET
    path: /
    query:
      session: ${sessions.atlas}
    expect_status: 200
  - name: page with a session, no key
    method: GET
    path: /
    auth: none
    query:
      session: ${sessions.atlas}
    expect_status: 200
  - name: page with a worker session, cookie
    method: GET
    path: /
    auth: cookie
    headers:
      Accept: text/html
    query:
      session: ${sessions.atlas_notes}
    expect_status: 200
  - name: page with a missing session
    method: GET
    path: /
    query:
      session: ${missing_session}
    expect_status: 200
  - name: page with an empty session
    method: GET
    path: /
    query:
      session: ""
    expect_status: 200
  - name: browser navigation without a key (login page)
    method: GET
    path: /home
    auth: none
    headers:
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    expect_status: 401
  - name: browser navigation to the events viewer without a key (login page)
    method: GET
    path: /sessions/${sessions.atlas}/events
    auth: none
    headers:
      Accept: text/html
    expect_status: 401
  - name: API fetch without a key (JSON 401)
    method: GET
    path: /api/sessions/
    auth: none
    headers:
      Accept: application/json
    expect_status: 401
  - name: POST without a key and an HTML accept (JSON 401)
    method: POST
    path: /api/sessions/groups/rename
    auth: none
    headers:
      Accept: text/html
    json: {old: Research, new: Studies}
    expect_status: 401
  - name: home page, cookie
    method: GET
    path: /home
    auth: cookie
    headers:
      Accept: text/html
    expect_status: 200
  - name: static script, no key, no gzip
    method: GET
    path: /static/js/app.js
    auth: none
    expect_status: 200
  - name: static script, no key, gzip accepted
    method: GET
    path: /static/js/app.js
    auth: none
    headers:
      Accept-Encoding: gzip
    expect_status: 200
  - name: static stylesheet, gzip accepted
    method: GET
    path: /static/css/styles.css
    headers:
      Accept-Encoding: gzip, deflate, br
    expect_status: 200
  - name: static file below the gzip size floor, gzip accepted
    method: GET
    path: /static/js/chat/namespace.js
    auth: none
    headers:
      Accept-Encoding: gzip
    expect_status: 200
  - name: missing static file
    method: GET
    path: /static/js/no-such-file.js
    auth: none
    expect_status: 404
  - name: router feature static mount
    method: GET
    path: /static/features/router/
    auth: none
    expect_status: 500
