<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Trace" }} — Perfetto — CharlieBot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #172033; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-shrink: 0; }
    #topbar .trace-name { font-size: 14px; font-weight: 500; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #topbar a { color: #7dd3fc; font-size: 13px; text-decoration: none; white-space: nowrap; }
    #topbar a:hover { text-decoration: underline; }
    #topbar .spacer { flex: 1; }
    #topbar .warn { color: #fbbf24; font-size: 13px; }
    #status { display: flex; align-items: center; justify-content: center; flex: 1; font-size: 15px; color: #94a3b8; }
    #status.error { color: #fca5a5; }
    #perfetto-iframe { flex: 1; border: none; width: 100%; display: none; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="trace-name" id="trace-label">{{ title or trace_dir or trace_names[0] }}</span>
    <span class="warn" id="warn-text"></span>
    <span class="spacer"></span>
    <a href="#" id="open-new-tab">Open in new tab</a>
  </div>

  <div id="status">Loading trace...</div>
  <iframe id="perfetto-iframe" allow="cross-origin-isolated"></iframe>

  <script>
    const PERFETTO_UI = 'https://ui.perfetto.dev';
    const traceUrls = {{ trace_urls | tojson }};
    const traceNames = {{ trace_names | tojson }};
    const traceTitle = {{ (title or trace_dir or trace_names[0]) | tojson }};

    const statusEl = document.getElementById('status');
    const iframeEl = document.getElementById('perfetto-iframe');
    const openNewTabLink = document.getElementById('open-new-tab');
    const traceLabelEl = document.getElementById('trace-label');
    const warnEl = document.getElementById('warn-text');

    let traceBuffer = null;

    function showError(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add('error');
    }

    function updateStatus(msg) {
      statusEl.textContent = msg;
    }

    function basename(name) {
      // Extract a short label from filename, e.g. 'rank000' from 'trace_rank000_step001.json'
      const m = name.match(/rank(\d+)/i);
      return m ? 'rank' + m[1] : name.replace(/\.json$/i, '');
    }

    async function fetchOneTrace(url, index) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${traceNames[index]}`);
      return resp.arrayBuffer();
    }

    function isJsonTrace(buf) {
      // Check if the first non-whitespace byte looks like JSON ('{' or '[')
      const view = new Uint8Array(buf, 0, Math.min(buf.byteLength, 64));
      for (let i = 0; i < view.length; i++) {
        const ch = view[i];
        if (ch === 0x20 || ch === 0x09 || ch === 0x0a || ch === 0x0d) continue;
        return ch === 0x7b || ch === 0x5b; // '{' or '['
      }
      return false;
    }

    function mergeJsonTraces(buffers) {
      const allEvents = [];
      for (let i = 0; i < buffers.length; i++) {
        const text = new TextDecoder().decode(buffers[i].buf);
        const json = JSON.parse(text);
        const events = json.traceEvents || (Array.isArray(json) ? json : []);
        const rankLabel = basename(traceNames[buffers[i].idx]);

        // Pass 1: scan metadata to build original pid -> label map
        const pidLabel = {};  // original pid -> 'CPU' or 'GPU N'
        for (const evt of events) {
          if (evt.ph === 'M' && evt.name === 'process_labels' && evt.args) {
            const lbl = evt.args.labels || '';
            pidLabel[evt.pid] = lbl;  // e.g. 'CPU' or 'GPU 0'
          }
        }

        // Pass 2: build synthetic pid mapping
        // CPU -> rankLabel, GPU N -> rankLabel + '/GPU N'
        const pidMap = {};
        for (const [origPid, lbl] of Object.entries(pidLabel)) {
          if (lbl === 'CPU') {
            pidMap[origPid] = rankLabel;
          } else {
            pidMap[origPid] = rankLabel + '/' + lbl;
          }
        }

        // Compute sort indices: CPU on top, then GPUs in order
        const baseSortIndex = i * 10000;
        const syntheticMeta = {};  // synthetic pid -> sort_index
        for (const [origPid, lbl] of Object.entries(pidLabel)) {
          const synPid = pidMap[origPid];
          if (lbl === 'CPU') {
            syntheticMeta[synPid] = { sortIndex: baseSortIndex, label: rankLabel + ' CPU' };
          } else {
            const gpuMatch = lbl.match(/GPU\s*(\d+)/i);
            const gpuIdx = gpuMatch ? parseInt(gpuMatch[1], 10) : 0;
            syntheticMeta[synPid] = { sortIndex: baseSortIndex + 1000 + gpuIdx, label: rankLabel + ' ' + lbl };
          }
        }

        // Pass 3: remap events
        for (const evt of events) {
          if (evt.ph === 'M' && evt.name && evt.name.startsWith('process_')) {
            // Drop original process-level metadata to avoid conflicts
            continue;
          }
          if (pidMap[evt.pid] !== undefined) {
            evt.pid = pidMap[evt.pid];
          } else {
            // Unknown pid — assign to rank's CPU group as fallback
            evt.pid = rankLabel;
          }
          if (evt.tid !== undefined) {
            evt.tid = rankLabel + '/' + evt.tid;
          }
          allEvents.push(evt);
        }

        // Emit synthetic metadata events for each new process
        for (const [synPid, meta] of Object.entries(syntheticMeta)) {
          allEvents.push({ ph: 'M', pid: synPid, tid: rankLabel + '/meta', name: 'process_name', args: { name: meta.label } });
          allEvents.push({ ph: 'M', pid: synPid, tid: rankLabel + '/meta', name: 'process_labels', args: { labels: meta.label } });
          allEvents.push({ ph: 'M', pid: synPid, tid: rankLabel + '/meta', name: 'process_sort_index', args: { sort_index: meta.sortIndex } });
        }
      }
      const merged = JSON.stringify({ traceEvents: allEvents });
      return new TextEncoder().encode(merged).buffer;
    }

    async function fetchAllTraces() {
      const total = traceUrls.length;
      let loaded = 0;
      const errors = [];

      if (total > 1) {
        traceLabelEl.textContent = `${total} traces` + (traceTitle ? ` from ${traceTitle}` : '');
      }

      const results = await Promise.allSettled(traceUrls.map((url, i) => {
        return fetchOneTrace(url, i).then(buf => {
          loaded++;
          updateStatus(`Loading ${loaded}/${total}...`);
          return { buf, idx: i };
        });
      }));

      const successes = [];
      for (const r of results) {
        if (r.status === 'fulfilled') {
          successes.push(r.value);
        } else {
          errors.push(r.reason.message);
        }
      }

      if (successes.length === 0) {
        showError('Error: all traces failed to load. ' + errors[0]);
        return null;
      }

      if (errors.length > 0) {
        warnEl.textContent = `⚠ ${errors.length} trace(s) failed to load`;
        warnEl.title = errors.join('\n');
      }

      // Single trace — pass through as-is
      if (successes.length === 1) {
        return successes[0].buf;
      }

      // Multiple traces — try JSON merge
      if (isJsonTrace(successes[0].buf)) {
        try {
          return mergeJsonTraces(successes);
        } catch (e) {
          warnEl.textContent = '⚠ JSON merge failed, showing first trace only';
          return successes[0].buf;
        }
      }

      // Non-JSON (protobuf) — can't merge, use first
      warnEl.textContent = '⚠ Non-JSON traces cannot be merged, showing first trace only';
      return successes[0].buf;
    }

    function sendToPerfetto(target, buffer, origin) {
      let pingInterval = null;

      const onMessage = (evt) => {
        if (evt.data !== 'PONG') return;
        window.removeEventListener('message', onMessage);
        if (pingInterval) clearInterval(pingInterval);

        target.postMessage({
          perfetto: {
            buffer: buffer,
            title: traceTitle,
          }
        }, origin);
      };

      window.addEventListener('message', onMessage);

      pingInterval = setInterval(() => {
        target.postMessage('PING', origin);
      }, 50);
    }

    function loadInIframe(buffer) {
      statusEl.style.display = 'none';
      iframeEl.style.display = 'block';
      iframeEl.src = PERFETTO_UI;

      iframeEl.addEventListener('load', () => {
        sendToPerfetto(iframeEl.contentWindow, buffer, PERFETTO_UI);
      });
    }

    openNewTabLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const buf = traceBuffer || await fetchAllTraces();
      if (!buf) return;
      const win = window.open(PERFETTO_UI);
      if (!win) {
        showError('Error: popup blocked. Please allow popups for this site.');
        return;
      }
      sendToPerfetto(win, buf, PERFETTO_UI);
    });

    (async () => {
      traceBuffer = await fetchAllTraces();
      if (!traceBuffer) return;
      loadInIframe(traceBuffer);
    })();
  </script>
</body>
</html>
