steps:
  - kind: ws
    name: catch-up from cursor zero ends with the buffered stream delta
    path: /ws/sessions/${sessions.stream_case}
    send:
      - json: {type: cursor, index: 0}
    collect:
      where: {type: stream}
      field: message.content
      decode: none
    until: {collected_contains: "An unfinished synthetic draft."}
    timeout_seconds: 10
    compare: {collected_contains: ["An unfinished synthetic draft."]}
  - kind: ws
    name: catch-up from cursor zero carries the committed user message
    path: /ws/sessions/${sessions.delta}
    send:
      - json: {type: cursor, index: 0}
    collect:
      where: {type: message}
      field: message.content
      decode: none
    until: {collected_contains: "What changed in the delta release notes?"}
    timeout_seconds: 10
    compare: {collected_contains: ["What changed in the delta release notes?"]}
  - kind: ws
    name: catch-up from cursor zero replays raw events and completes
    path: /ws/sessions/${sessions.explain}
    send:
      - json: {type: cursor, index: 0}
    collect:
      where: {}
      field: type
      decode: none
    until: {collected_contains: "catchup_complete"}
    timeout_seconds: 10
    compare: {collected_contains: ["master_done", "catchup_complete"]}
  - kind: ws
    name: catch-up from a middle cursor replays only the events at and after it
    path: /ws/sessions/${sessions.explain}
    send:
      - json: {type: cursor, index: 4}
    collect:
      where: {}
      field: type
      decode: none
    until: {collected_contains: "catchup_complete"}
    timeout_seconds: 10
    compare: {collected_contains: ["master_done", "catchup_complete"]}
  - kind: ws
    name: cursor at the total sends only catchup_complete
    path: /ws/sessions/${sessions.explain}
    send:
      - json: {type: cursor, index: 10}
    until: {frames: 1}
    timeout_seconds: 10
  - kind: ws
    name: cursor past the total sends only catchup_complete
    path: /ws/sessions/${sessions.explain}
    send:
      - json: {type: cursor, index: 999999}
    until: {frames: 1}
    timeout_seconds: 10
  - kind: ws
    name: worker session catch-up replays the runs transcript
    path: /ws/sessions/${sessions.atlas_notes}
    send:
      - json: {type: cursor, index: 0}
    until: {frames: 2}
    timeout_seconds: 10
  - kind: ws
    name: an invalid-JSON cursor continues from zero
    path: /ws/sessions/${missing_session}
    send:
      - text: "{"
    until: {frames: 1}
    timeout_seconds: 10
  - kind: ws
    name: missing token rejects the upgrade
    path: /ws/sessions/${sessions.explain}
    auth: none
    send: []
    until: {frames: 0}
    timeout_seconds: 5
    expect_reject: 403
  - name: schedule the first live session-channel trigger
    method: POST
    path: /api/internal/schedule-trigger
    json:
      session_id: ${sessions.atlas}
      delay_seconds: 4
      message: Wake the synthetic session socket.
    capture: {trigger_a1: trigger_id}
    expect_status: 200
    defer_files: true
  - name: schedule the second live session-channel trigger
    method: POST
    path: /api/internal/schedule-trigger
    json:
      session_id: ${sessions.atlas}
      delay_seconds: 9
      message: Wake the synthetic session socket again.
    capture: {trigger_a2: trigger_id}
    expect_status: 200
    defer_files: true
  - name: schedule the first live sidebar trigger
    method: POST
    path: /api/internal/schedule-trigger
    json:
      session_id: ${sessions.fable}
      delay_seconds: 12
      message: Wake the synthetic sidebar socket.
    capture: {trigger_b1: trigger_id}
    expect_status: 200
    defer_files: true
  - name: schedule the second live sidebar trigger
    method: POST
    path: /api/internal/schedule-trigger
    json:
      session_id: ${sessions.garnet}
      delay_seconds: 17
      message: Wake the synthetic sidebar socket again.
    capture: {trigger_b2: trigger_id}
    expect_status: 200
    defer_files: true
  - name: schedule the third live sidebar trigger
    method: POST
    path: /api/internal/schedule-trigger
    json:
      session_id: ${sessions.ember}
      delay_seconds: 22
      message: Wake the synthetic sidebar socket a third time.
    capture: {trigger_b3: trigger_id}
    expect_status: 200
    defer_files: true
  - name: schedule the fourth live sidebar trigger
    method: POST
    path: /api/internal/schedule-trigger
    json:
      session_id: ${sessions.atlas_survey}
      delay_seconds: 27
      message: Wake the synthetic sidebar socket a fourth time.
    capture: {trigger_b4: trigger_id}
    expect_status: 200
    defer_files: true
  - kind: ws
    name: the trigger turns reach the live socket on the session channel
    path: /ws/sessions/${sessions.atlas}
    send:
      - json: {type: cursor, index: 999999}
    collect:
      where: {type: message}
      field: message.content
      decode: none
    until: {collected_contains: "The synthetic stream trigger was handled."}
    timeout_seconds: 30
    compare: {collected_contains: ["The synthetic stream trigger was handled."]}
  - kind: ws
    name: the trigger turns reach the live socket on the sidebar channel
    path: /ws/sessions/${sessions.atlas}
    send:
      - json: {type: cursor, index: 999999}
    collect:
      where: {type: running_changed}
      field: type
      decode: none
    until: {collected_contains: "running_changed"}
    timeout_seconds: 30
    compare: {collected_contains: ["running_changed"]}
  - kind: wait
    name: wait for the last live trigger to fire before shutdown
    timeout_seconds: 60
    until:
      file_field:
        path: sessions/${sessions.atlas_survey}/triggers/${capture.trigger_b4}.json
        field: status
        equals: fired
