[project]
name = "charlie-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "croniter>=6.2.2",
    "fastapi>=0.135.2",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "sherpa-onnx>=1.13.4",
    # sherpa-onnx-core ships libonnxruntime.so; sherpa-onnx's PyPI sdist omits
    # the dependency, so uv's universal resolution would drop it without this
    # direct requirement. Keep the pin matched to the resolved sherpa-onnx.
    "sherpa-onnx-core==1.13.4",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.42.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
]

[project.scripts]
charliebot = "src.cli.main:main"
claude-sub = "src.cli.claude_sub:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "local_only: requires host-local resources (GPU, tailnet, local services, installed local binaries); CI runs -m 'not local_only'",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
