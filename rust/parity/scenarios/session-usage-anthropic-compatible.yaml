stage: session-read-api
name: session-usage-anthropic-compatible
config:
  backends:
    options:
      - id: claude-synthetic-anthropic
        label: Synthetic Anthropic-compatible endpoint
        type: cc-anthropic-compatible
        model: synthetic-anthropic-model
        api_base: https://anthropic-compatible.synthetic.test
        context_window: 409600
steps:
  - name: usage, manager on Anthropic-compatible option
    method: GET
    path: /api/sessions/${sessions.atlas}/usage
    expect_status: 200
  - name: usage, worker on Anthropic-compatible option
    method: GET
    path: /api/sessions/${sessions.atlas_notes}/usage
    expect_status: 200
