stage: features
name: features-slack-reply-refusals
config:
  slack:
    allowed_user_ids: [U0PARITY]
credentials:
  slack:
    bot_token: xoxb-parity-synthetic-token
    app_token: xapp-parity-synthetic-token
fakes:
  slack: {}
steps:
  - name: refuse a reply to a session without a Slack thread
    method: POST
    path: /api/internal/slack/reply
    json:
      session_id: ${sessions.atlas}
      text: "A reply"
    expect_status: 409
  - name: refuse blank reply text
    method: POST
    path: /api/internal/slack/reply
    json:
      session_id: ${sessions.delta}
      text: "  "
    expect_status: 422
  - name: refuse a CharlieBot file-server link in a reply
    method: POST
    path: /api/internal/slack/reply
    json:
      session_id: ${sessions.delta}
      text: "Read https://synthetic.invalid/absolute_filepath/workspace/report.md"
    expect_status: 422
