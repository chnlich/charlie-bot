- id: '104'
  title: Wrap blocking sync I/O in improve_command loop-state helpers with asyncio.to_thread
  in_progress_at: '2026-04-19T21:09:28Z'
  done_reason: 'Already resolved: commit f01a500 ("Wrap improve loop state I/O in
    to_thread") converted the six improve-loop state helpers to async/to_thread and
    updated their await sites in src/api/internal.py and src/core/improve_command.py.'
  description: 'PURPOSE — Prevent event-loop blocking when the improve loop reads
    and writes its on-disk state. The state helpers load_loop_state (src/core/improve_command.py:83),
    save_loop_state (L91), clear_active_loop_lock (L98), next_loop_id (L105), _reserve_loop_dir
    (L123), and find_running_loop (L138) all perform synchronous filesystem I/O (path.exists,
    path.read_text, path.write_text, path.mkdir, path.unlink, path.iterdir) directly
    on the event loop. These helpers are called from async orchestration paths — including
    run_improve_loop (L578, L607, L637, L641, L644, L656, L682, L685), _run_single_iteration
    (L437), _wait_for_quota_recovery (L290) which polls inside a while-loop, stop_improve_loop
    (L170), and three API endpoints in src/api/internal.py that list and reserve loops
    per request. The polling in _wait_for_quota_recovery calls load_loop_state every
    ~10s during quota waits, each time doing a sync file read on the event loop. Every
    iteration boundary issues a load_loop_state/save_loop_state pair of blocking reads
    and writes. Net effect: the event loop stalls briefly on disk I/O during improve
    loops, degrading WebSocket broadcast latency and sidebar responsiveness for all
    concurrent sessions. Item 081 ("Wrap blocking sync I/O in asyncio.to_thread in
    improve_command.py") was narrowly scoped to the two parse_ndjson_file calls plus
    three inline fs calls inside run_improve_loop, and explicitly did NOT cover the
    shared state helpers — verified by rereading the 081 description and by grepping
    the file for remaining sync fs calls (15 sites still blocking). Item 103 (extract
    require_loop_state) is orthogonal — it only deduplicates the None-check boilerplate
    around load_loop_state, not the blocking I/O itself. HOW — (1) Convert load_loop_state,
    save_loop_state, clear_active_loop_lock, next_loop_id, _reserve_loop_dir, and
    find_running_loop to async functions, awaiting asyncio.to_thread around the path.exists
    / read_text / write_text / mkdir / unlink / iterdir calls. (2) Update all callers
    in improve_command.py (~10 sites) and src/api/internal.py (3 sites) and src/core/slash_commands.py
    if used, to await the new async helpers. (3) If any caller is itself synchronous,
    introduce a small sync shim or make that caller async — prefer the latter since
    every caller already lives in an async context. ~20-30 lines changed, matching
    the established pattern from items 034, 035, 043, 044, 046, 057, 073, and 081.
    Asyncio is already imported in both files. No behavior changes — only concurrency
    characteristics improve.'
  category: performance
  status: done
  created: '2026-04-18T08:00:00Z'
  priority: medium
- id: '105'
  title: Extract session-title sanitization from maybe_auto_name into pure helper
  description: 'PURPOSE — Shrink the 96-line maybe_auto_name orchestrator in src/core/autonamer.py
    and make the LLM-output sanitization logic testable and reusable without spinning
    up a SessionManager, streaming_manager, or any network provider. Today the sanitization
    pipeline (strip quotes, strip markdown, strip preamble, length/word-count gating,
    session-number prefix) is inlined across L186-205 of autonamer.maybe_auto_name,
    tangled with rename_session side effects, broadcast side effects, group fuzzy-matching,
    and Exception-swallowing logging. This prevents reuse in any other place that
    ever needs to clean up an LLM title (e.g. slash-command /name, worker auto-naming,
    import from Linear/Feishu titles) and forces tests to mock four collaborators
    just to exercise string-cleanup rules. The sanitization rules are also subtle
    — 60-char cap, _MAX_TITLE_WORDS cap, _MARKDOWN_CHARS_RE, _PREAMBLE_RE, _SESSION_NUMBER_RE
    prefixing — and an untested pure pipeline is where bugs quietly accumulate. No
    existing backlog item covers this: 031 unifies the DEFAULT_SESSION_NAME regex
    between chat.py and autonamer.py; 051 concerns subprocess timeout cleanup in autonamer
    and latex; 055 sanitizes uploaded filenames; 068 centralizes timeout constants
    and removes the unused AUTONAMER_TIMEOUT import. None of them touch the title-sanitization
    block. HOW — (1) Add a pure synchronous helper `_sanitize_session_title(raw: str,
    session_name: str) -> str | None` to src/core/autonamer.py that encapsulates lines
    186-205: quote-strip, _MARKDOWN_CHARS_RE.sub, _PREAMBLE_RE.sub, the 60-char /
    _MAX_TITLE_WORDS length gate, and _SESSION_NUMBER_RE prefixing. Returns the final
    name or None when the sanitized output should be discarded. (2) Also fold the
    raw first-line fallback loop (L177-184) into the helper so maybe_auto_name only
    passes `raw` and `session_meta.name` in. (3) Rewrite maybe_auto_name to call the
    helper: `name = _sanitize_session_title(raw, session_meta.name); if name is None:
    return`. This drops maybe_auto_name from ~96 to ~55 lines, puts it below the 50-line
    soft target after a trivial follow-up, and opens the door to direct unit testing
    of the regex gauntlet without async plumbing. ~40 lines moved, 0 behavior changes
    — the helper preserves the exact current order of operations and the same None-returning
    conditions that currently `return` out of maybe_auto_name.'
