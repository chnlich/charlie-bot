- id: 089
  title: Fix event-loss window in thread_websocket by subscribing before catchup
  description: 'PURPOSE — Prevent live worker events from being silently dropped during
    the thread WebSocket connection setup. server.py thread_websocket (L172-224) subscribes
    to the StreamingManager AFTER sending catchup events (subscribe at L209, catchup
    at L186-199). Any events broadcast by the worker between the catchup file read
    and the subscribe call are lost — the client never receives them and has no way
    to detect the gap. This is the exact bug that was already fixed in the session
    WebSocket endpoint (L106-164), which deliberately subscribes BEFORE catchup (L128)
    with an explanatory comment: "Subscribe BEFORE catchup so no events are lost between
    catchup and subscribe." The thread WS handles live worker output where events
    arrive at high frequency during active work, making the race window more likely
    to trigger than in the session WS case. HOW — Move the streaming_manager.subscribe(thread_id,
    websocket) call (L209) to immediately after websocket.accept() (after L181), before
    the catchup file read. Move the corresponding unsubscribe into a finally block
    wrapping the entire catchup + keepalive sequence. This matches the session WS
    pattern exactly. The client already handles potential duplicates (events that
    arrive via both catchup and live subscription) since send_text is idempotent for
    display purposes. ~5 lines moved, no new code. Fixes a latent event-loss bug for
    every thread WS connection.'
