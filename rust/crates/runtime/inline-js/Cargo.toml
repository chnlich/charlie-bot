[package]
name = "charliebot-inline-js"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The minifier runs only in build.rs, so the server binary carries the table and none of the minifier. Every oxc
# crate is pinned to one version: the lock fixes the minifier's output, and a bump is a reviewed change to the table.
[dependencies]
serde_json.workspace = true
sha2.workspace = true

[build-dependencies]
oxc_allocator = "=0.160.0"
oxc_ast = "=0.160.0"
oxc_codegen = "=0.160.0"
oxc_minifier = "=0.160.0"
oxc_parser = "=0.160.0"
oxc_semantic = "=0.160.0"
oxc_span = "=0.160.0"
sha2.workspace = true
