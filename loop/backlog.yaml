    WHAT — Extract one private helper `_finalize_worker_safely(...) -> None` from
    the L594-617 finally block of `spawn_worker` in src/core/spawner.py. The block
    has a single, name-worthy concept: "call `_finalize_worker`; if finalization itself
    raises, log the failure and broadcast a session-level ERROR event to the user
    (best-effort — if the broadcast itself raises, swallow with a warning log so the
    original finalization error is not lost behind a secondary fault)." It is 23 body
    lines of self-contained error-handling-around-finalize logic and is the only block
    in `spawn_worker` worth its own helper — the surrounding structure is small: takeoff
    check (L561-562, 2 lines), variable initialization (L564-568, 5 lines), repoless-vs-worktree
