# The release trial tests take the in-process TRIAL_RUNS mutex so their port picks cannot collide;
# a mutex cannot reach across nextest's one-process-per-test isolation, so this group serializes
# them the way the mutex did under `cargo test`.
[test-groups]
release-trials = { max-threads = 1 }
headless-renderer = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(=charliebot-script-tests::release) and (test(/^test_trial_serve/) or test(/^test_trial_config/) or test(=test_trial_installs_the_commits_units_and_reloads_before_its_server_starts))'
test-group = 'release-trials'

[[profile.default.overrides]]
filter = '(package(=charliebot-artifacts) and (test(/headless_render/) or test(=artifact_check::tests::test_warm_renderer_measures_real_page_height) or test(=artifact_check::tests::plan_page_height_probe_is_removed_after_a_renderer_launch_failure))) or binary_id(=charliebot-cli::artifact_renderer) or binary_id(=charliebot-server::startup_signal)'
test-group = 'headless-renderer'

# The profile CI runs nextest with (`cargo nextest run --profile ci`). A failure cancels nothing so the
# JUnit report covers every test; the report carries each test's wall-clock time for the 0.1 s check.
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

[profile.integration]
inherits = "ci"

[profile.integration.junit]
path = "junit.xml"

# The profile the 0.1 s check uses for each isolated round. One test thread keeps selected tests serial;
# fail-fast stays off so every selected test has a JUnit row even when a test fails.
[profile.check]
test-threads = 1
fail-fast = false

[profile.check.junit]
path = "junit.xml"
