# Repo-owned default scheduled tasks. ./scripts/setup.sh seeds each entry into
# its own host file ~/.charliebot/config.d/cron.d/<name>.yaml (the job `name`
# becomes the file name, and the host file body carries no `name` key), and
# never touches a file that is already there. Host-specific fields (backend,
# schedule) belong in the host files, not here.
scheduled_tasks:
  - name: memory-curator
    cron: "27 6 * * *"
    timezone: local
    prompt_file: prompts/cron/memory_curator/memory_curator.md
