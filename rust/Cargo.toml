[workspace]
resolver = "2"
members = [
    "crates/charliebot-agents",
    "crates/charliebot-core",
    "crates/charliebot-compat",
    "crates/charliebot-server",
    "crates/charliebot-tasks",
    "crates/features/pyhtml",
    "crates/features/artifacts",
    "crates/features/backup",
    "crates/features/chat_threads",
    "crates/features/code_server",
    "crates/features/diag",
    "crates/features/disk_sweep",
    "crates/features/diff_view",
    "crates/features/discord",
    "crates/features/explain",
    "crates/features/files",
    "crates/features/host_auth",
    "crates/features/memory",
    "crates/features/ncu",
    "crates/features/slack",
    "crates/features/terminal",
    "crates/features/trace",
    "crates/features/usage",
    "crates/features/voice",
    "crates/features/web_reply",
    "crates/charliebot-store",
    "crates/charliebot-registry",
    "crates/charliebot-session-api",
    "crates/charliebot-sched",
    "crates/charliebot-usage",
]
exclude = ["vendor/sherpa-onnx-sys"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bzip2 = "0.5"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
libc = "0.2"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-proxy"] }
md-5 = "0.10"
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
multer = "3.1"
nix = { version = "0.30", features = ["fs", "process", "hostname", "user", "signal"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["shared"] }
subtle = "2"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time", "process", "sync", "io-util"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }

charliebot-artifacts = { path = "crates/features/artifacts" }
charliebot-agents = { path = "crates/charliebot-agents" }
charliebot-backup = { path = "crates/features/backup" }
charliebot-chat-threads = { path = "crates/features/chat_threads" }
charliebot-code-server = { path = "crates/features/code_server" }
charliebot-compat = { path = "crates/charliebot-compat" }
charliebot-core = { path = "crates/charliebot-core" }
charliebot-diag = { path = "crates/features/diag" }
charliebot-disk-sweep = { path = "crates/features/disk_sweep" }
charliebot-diff-view = { path = "crates/features/diff_view" }
charliebot-discord = { path = "crates/features/discord" }
charliebot-explain = { path = "crates/features/explain" }
charliebot-files = { path = "crates/features/files" }
charliebot-host-auth = { path = "crates/features/host_auth" }
charliebot-memory = { path = "crates/features/memory" }
charliebot-ncu = { path = "crates/features/ncu" }
charliebot-pyhtml = { path = "crates/features/pyhtml" }
charliebot-registry = { path = "crates/charliebot-registry" }
charliebot-slack = { path = "crates/features/slack" }
charliebot-store = { path = "crates/charliebot-store" }
charliebot-session-api = { path = "crates/charliebot-session-api" }
charliebot-sched = { path = "crates/charliebot-sched" }
charliebot-tasks = { path = "crates/charliebot-tasks" }
charliebot-terminal = { path = "crates/features/terminal" }
charliebot-trace = { path = "crates/features/trace" }
charliebot-usage = { path = "crates/charliebot-usage" }
charliebot-usage-page = { path = "crates/features/usage" }
charliebot-voice = { path = "crates/features/voice" }
charliebot-web-reply = { path = "crates/features/web_reply" }

# Line tables keep backtrace file and line numbers; full debug info bloats each test binary to ~400 MB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
