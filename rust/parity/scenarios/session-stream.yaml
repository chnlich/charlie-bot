# The session WebSocket: catch-up at several cursors, the worker transcript projection, the cursor
# failure fallbacks, and live frames a scheduled trigger produces while the socket is subscribed.
stage: session-stream
name: session-stream
fixture_extras: [explain_cases, session_stream_cases]
expect_starts: 9
fake_agent:
  starts:
    - name: claude
      steps:
        - emit: {type: system, subtype: init, session_id: synthetic-stream-trigger}
        - emit:
            type: assistant
            message:
              role: assistant
              model: claude-sonnet-5
              content: [{type: text, text: The synthetic stream trigger was handled.}]
        - emit:
            type: result
            result: ""
            usage: {input_tokens: 3, output_tokens: 2, cache_read_input_tokens: 0, cache_creation_input_tokens: 0}
            total_cost_usd: 0.0
      exit_code: 0
