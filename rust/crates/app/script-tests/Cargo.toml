[package]
name = "charliebot-script-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The stand-in programs the script tests copy into their release roots and panes. Each test binary's stubs and the
# scripts under test are shared through charliebot-shell-harness.
[[bin]]
name = "fake-release-server"
path = "src/bin/fake_release_server.rs"

[[bin]]
name = "fake-pane-server"
path = "src/bin/fake_pane_server.rs"

# The release's `charliebot` under test: the switch-helper subcommands the switch calls.
[[bin]]
name = "fake-charliebot"
path = "src/bin/fake_charliebot.rs"

# The stand-in server of the held-port serve trial: it logs server_ready and never binds a port.
[[bin]]
name = "serve-stub"
path = "src/bin/serve_stub.rs"

# The stand-in server of the SIGTERM serve test: it binds the trial's port and ignores SIGTERM.
[[bin]]
name = "term-ignoring-server"
path = "src/bin/term_ignoring_server.rs"

# The stand-in holder of a serve trial's port that `ss -p` cannot name: non-dumpable, so its fd table is unreadable.
[[bin]]
name = "port-holder"
path = "src/bin/port_holder.rs"

[dependencies]
charliebot-agents.workspace = true
charliebot-charlie-code.workspace = true
charliebot-cli-common.workspace = true
charliebot-core.workspace = true
charliebot-session-api.workspace = true
charliebot-store.workspace = true
charliebot-tasks.workspace = true
charliebot-switch-helper.workspace = true
http.workspace = true
libc.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
base64.workspace = true
charliebot-shell-harness.workspace = true
chrono.workspace = true
nix.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true
uuid.workspace = true
