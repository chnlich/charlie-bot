- id: '165'
  title: Extract shared _dispatch_substituted_slash_prompt helper to deduplicate the
    create_logged_task(run_and_finalize(...)) prompt-dispatch block between api/chat.send_message
    and api/slash.execute_command
  description: 'WHY — The two HTTP endpoints `api/chat.send_message` (src/api/chat.py:95-105)
    and `api/slash.execute_command` (src/api/slash.py:184-193) both render the `dispatch.kind
    == ''prompt''` branch of a `SlashDispatchResult` (from `core.slash_commands.dispatch_slash_command`)
    by firing-and-forgetting the same `create_logged_task(run_and_finalize(...))`
    call with the identical 7-keyword-argument shape: `cfg, meta, build_agent_input_content(dispatch.substituted_prompt,
    uploaded_files), session_mgr, extra_claude_flags=dispatch.claude_code_flags, skip_user_event=True,
    display_content=<display_text>, uploaded_files=uploaded_files`. The two blocks
    are character-for-character identical except for the `display_content` source
    (chat.py passes `req.content`, slash.py passes the synthesized `display_text`
    = `"/{name}" + (" {args_text}" if args_text else "")`). `pylint --disable=all
    --enable=duplicate-code src/` flags this pair as R0801 (8-line shared block including
    the call boilerplate). Pending item #144 explicitly considers and rejects cross-file
    dedup of the FULL slash-render block (`prompt` + `error` + `shell_result` branches)
    because the `error` and `shell_result` branches return different response shapes
    (chat.py wraps results in ASSISTANT + MASTER_DONE WebSocket events; slash.py returns
    inline JSON), so #144 keeps the chat-side extraction local to chat.py. But the
    `prompt` branch alone is different: it does NOT render a response inline — it
    fires off the master CC run and the two callers separately build their own 202
    JSONResponse with caller-specific content (`{"status": "accepted"}` in chat.py
    vs `{''type'': ET.PROMPT_DISPATCHED, ''command'': name}` in slash.py). That makes
    the shared work the fire-and-forget itself, with the response shape staying caller-local.
    This is the second clause of the dedup rule: the helper has a clear single-responsibility
    name worth its own concept ("kick off master CC for a slash-command-substituted
    prompt with the right flags and uploaded-file payload") even though the block
    is only ~10 lines. Risk of silent divergence is concrete — any future addition
    of a new keyword argument to `run_and_finalize` for slash dispatch (e.g. a new
    `slash_command_name` arg for telemetry, or a `dispatch_origin` tag) would have
    to be added to both call sites in lockstep, and prior commits to this codebase
    have already shown one path being updated without the other.

    WHAT — Add a module-level sync helper in src/api/message_utils.py (where `build_agent_input_content`,
    `build_user_event`, `extract_text_from_message`, and `serialize_uploaded_files`
    already live and are imported by both chat.py and slash.py):

    ```python def dispatch_substituted_slash_prompt(     cfg: CharlieBotConfig,     meta:
    SessionMetadata,     dispatch: SlashDispatchResult,     display_content: str,     uploaded_files:
    list[dict],     session_mgr: SessionManager, ) -> None:   """Fire-and-forget master
    CC run for a substituted slash-command prompt.""" create_logged_task(       run_and_finalize(           cfg,           meta,           build_agent_input_content(dispatch.substituted_prompt,
    uploaded_files),           session_mgr,           extra_claude_flags=dispatch.claude_code_flags,           skip_user_event=True,           display_content=display_content,           uploaded_files=uploaded_files))
    ```

    The helper imports `create_logged_task` from `src.core.tasks`, `run_and_finalize`
    from `src.agents.master_cc`, `SlashDispatchResult` from `src.core.slash_commands`,
    `CharlieBotConfig` from `src.core.config`, `SessionManager` from `src.core.sessions`,
    and `SessionMetadata` from `src.core.models` — all already used elsewhere in `message_utils.py`
    or trivially available. The helper is sync (returns None) because `create_logged_task`
    already wraps the coroutine in an asyncio task with logging; no `await` is needed
    at the call site.

    Replace src/api/chat.py:95-105 (the `if dispatch.kind == ''prompt'':` block body,
    keeping the `if` guard and the `return JSONResponse(...)` line) with: `dispatch_substituted_slash_prompt(cfg,
    meta, dispatch, req.content, uploaded_files, session_mgr)`. Replace src/api/slash.py:184-193
    (same body in the `if dispatch.kind == ''prompt'':` block) with: `dispatch_substituted_slash_prompt(cfg,
    meta, dispatch, display_text, uploaded_files, session_mgr)`. Each call site retains
    its caller-specific `persist_and_broadcast` of the user event (already done a
    couple lines earlier in each function) and its caller-specific `return JSONResponse(...)`
    on the line after the helper call. No behavior change — pure refactor.

    Interaction with pending item #144: when #144 lands (extracts the full slash-interception
    block in chat.send_message into `_try_handle_slash_command`), the chat-side call
    site for this helper moves from `send_message` into `_try_handle_slash_command`
    but the helper signature and the slash.py call site stay unchanged. The two items
    are independent and can land in either order; if #144 lands first, the chat-side
